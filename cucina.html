<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title-tag">后厨申购与管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 font-sans transition-all duration-300">

    <header class="bg-teal-700 text-white p-4 shadow-md sticky top-0 z-20 flex justify-between items-center">
        <h1 id="nav-title" class="text-md font-bold">🍳 后厨申购与管理系统</h1>
        <div class="flex items-center gap-3">
            <button onclick="downloadFrontend()" id="btn-download" class="bg-teal-800 text-white text-xs px-2 py-1 rounded border border-teal-600 hover:bg-teal-700 transition flex items-center gap-1">
                💾 下载前端
            </button>
            <select id="langSelect" onchange="changeLanguage()" class="bg-teal-800 text-white text-xs px-2 py-1 rounded border border-teal-600 focus:outline-none">
                <option value="zh">中文</option>
                <option value="it">Italiano</option>
                <option value="bn">বাংলা</option>
            </select>
            <div class="flex gap-1">
                <button onclick="switchTab('chef')" id="btn-chef" class="bg-teal-900 text-xs px-3 py-1.5 rounded-md font-bold transition">员工端</button>
                <button onclick="switchTab('admin')" id="btn-admin" class="bg-teal-600/50 text-xs px-3 py-1.5 rounded-md hover:bg-teal-600 transition">管理端</button>
            </div>
        </div>
    </header>

    <main id="view-chef-login" class="p-6 max-w-md mx-auto mt-10">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4">
            <h2 id="txt-login-title" class="text-lg font-bold text-gray-800 text-center mb-2">🧑‍🍳 员工登录 / 选择身份</h2>
            <p id="txt-login-desc" class="text-xs text-gray-500 text-center mb-6">请选择您的名字并输入密码以记录申购单。</p>
            <div>
                <label id="lbl-login-chef" class="block text-xs text-gray-600 mb-2">您的名字</label>
                <select id="loginChefName" class="w-full p-3 border border-gray-300 rounded-lg text-sm bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </select>
            </div>
            <div>
                <label class="block text-xs text-gray-600 mb-2">密碼</label>
                <input type="password" id="loginPassword" class="w-full p-3 border border-gray-300 rounded-lg text-sm bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="請輸入密碼">
            </div>
            <button onclick="loginAsChef()" id="btn-login" class="w-full bg-teal-600 text-white py-3 rounded-lg font-bold hover:bg-teal-700 transition shadow-sm">
                進入员工端
            </button>
        </div>
    </main>

    <main id="view-admin-login" class="hidden p-6 max-w-md mx-auto mt-10">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4">
            <h2 class="text-lg font-bold text-gray-800 text-center mb-2">🔑 管理员登录</h2>
            <p class="text-xs text-gray-500 text-center mb-6">为了数据安全，请输入管理员密码以进入管理端。</p>
            <div>
                <label class="block text-xs text-gray-600 mb-2">管理员密码</label>
                <input type="password" id="loginAdminPassword" class="w-full p-3 border border-gray-300 rounded-lg text-sm bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="請輸入管理密碼">
            </div>
            <button onclick="loginAsAdmin()" class="w-full bg-teal-600 text-white py-3 rounded-lg font-bold hover:bg-teal-700 transition shadow-sm">
                进入管理端
            </button>
        </div>
    </main>

    <main id="view-chef" class="hidden p-4 max-w-md mx-auto mb-24 space-y-4">
        <div class="flex justify-between items-center bg-white px-3 py-2 rounded-lg border border-gray-200 text-xs text-gray-600">
            <div>
                <span id="txt-login-as">当前身份：</span><strong id="currentChefName" class="text-teal-700">張師傅</strong>
            </div>
            <button onclick="logoutChef()" class="text-red-500 font-semibold hover:underline">登出</button>
        </div>

        <div class="flex gap-2">
            <input type="text" id="searchInput" oninput="filterItems()" placeholder="搜索物料名称、部门或意大利文..." 
                   class="w-2/3 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white text-sm">
            
            <select id="sortSelect" onchange="sortChefItems()" class="w-1/3 p-2 border border-gray-300 rounded-lg text-xs bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-teal-500">
                <option id="opt-sort-default" value="default">默认排序</option>
                <option id="opt-sort-name" value="name">按材料名称</option>
                <option id="opt-sort-chef" value="chef">按订货人</option>
                <option id="opt-sort-category" value="category">按材料类别</option>
            </select>
        </div>

        <div id="chefItemsContainer" class="space-y-3"></div>

        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-lg max-w-md mx-auto">
            <div class="flex justify-between items-center mb-2 text-sm text-gray-600">
                <span id="txt-selected">已选物料: <strong id="selectedCount" class="text-teal-600">0</strong> 項</span>
                <button onclick="clearSelection()" id="txt-clear" class="text-red-500 text-xs">清空选择</button>
            </div>
            <button id="btn-submit" onclick="submitOrder()" 
                    class="w-full bg-teal-600 text-white py-3 rounded-lg font-bold hover:bg-teal-700 transition shadow-sm">
                确认提交申购
            </button>
        </div>
    </main>

    <main id="view-admin" class="hidden p-4 max-w-md mx-auto mb-10 space-y-6">
        
        <div class="flex justify-between items-center bg-white px-3 py-2 rounded-lg border border-gray-200 text-xs text-gray-600">
            <div>
                <span>當前模式：<strong>管理端</strong></span>
            </div>
            <button onclick="logoutAdmin()" class="text-red-500 font-semibold hover:underline">退出管理端</button>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border text-center">
                <span id="txt-pending-label" class="block text-xs text-gray-500 mb-1">今日待处理</span>
                <span id="pendingCount" class="text-2xl font-bold text-orange-500">0</span>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border text-center">
                <span id="txt-total-label" class="block text-xs text-gray-500 mb-1">总物料种类</span>
                <span id="totalItemsCount" class="text-2xl font-bold text-teal-600">0</span>
            </div>
        </div>

        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h2 id="txt-import-title" class="text-md font-bold text-gray-800 mb-2">📥 导入数据文件</h2>
            <p id="txt-import-desc" class="text-xs text-gray-500 mb-3">支持从系统导出的 Excel (.xlsx, .xls) 或 CSV 清单，一键录入。</p>
            <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="handleFileImport(this)"
                   class="w-full p-2 border border-gray-200 rounded-md text-xs file:mr-4 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer">
            <div id="import-save-area" class="hidden mt-3">
                <p id="import-preview-msg" class="text-xs text-gray-500 mb-2"></p>
                <button onclick="saveImportedToSupabase()" class="w-full bg-teal-600 text-white py-2 rounded-lg text-sm font-bold hover:bg-teal-700 transition">
                    💾 保存到 Supabase
                </button>
            </div>
        </section>

        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h2 id="txt-add-title" class="text-md font-bold text-gray-800 mb-3">➕ 建立/分配物料信息</h2>
            <form id="addItemForm" onsubmit="handleAddItem(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">貨物號</label>
                    <input type="text" id="formItemCode" placeholder="例如：001"
                           class="w-full p-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-teal-500">
                </div>
                <div>
                    <label id="lbl-italian" class="block text-xs text-gray-600 mb-1">意大利文名称</label>
                    <input type="text" id="formItalianName" required placeholder="例如：Involtino primavera"
                           class="w-full p-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-teal-500">
                </div>
                <div>
                    <label id="lbl-itemname" class="block text-xs text-gray-600 mb-1">中文名稱</label>
                    <input type="text" id="formItemName" placeholder="例如：青島素春捲"
                           class="w-full p-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-teal-500">
                </div>
                <div>
                    <label id="lbl-spec" class="block text-xs text-gray-600 mb-1">規格</label>
                    <input type="text" id="formSpec" placeholder="例如：10X900G"
                           class="w-full p-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-teal-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label id="lbl-price" class="block text-xs text-gray-600 mb-1">價格</label>
                        <input type="number" id="formPrice" step="0.01" placeholder="0.00"
                               class="w-full p-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">進貨單位</label>
                        <input type="text" id="formSupplier" placeholder="例如：jfc"
                               class="w-full p-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-teal-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">產品型號</label>
                        <input type="text" id="formModelNo" placeholder="例如：A9013"
                               class="w-full p-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">材料類型</label>
                        <input type="text" id="formCategory" placeholder="例如：salsa"
                               class="w-full p-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-teal-500">
                    </div>
                </div>
                <div>
                    <label id="lbl-dept" class="block text-xs text-gray-600 mb-1">使用单位 (可多选)</label>
                    <div id="deptCheckboxes" class="grid grid-cols-3 gap-2 bg-gray-50 p-2 rounded-md border border-gray-200 text-xs text-gray-700">
                        </div>
                </div>
                <div>
                    <label id="lbl-cycle" class="block text-xs text-gray-600 mb-1">进货周期 (星期制，可多选)</label>
                    <div id="cycleCheckboxes" class="grid grid-cols-4 gap-1 text-[10px] bg-gray-50 p-2 rounded-md border border-gray-200 text-gray-700">
                        </div>
                </div>
                <button type="submit" id="btn-save" class="w-full bg-teal-600 text-white text-sm py-2 px-3 rounded-md hover:bg-teal-700 transition font-bold mt-1">
                    保存到物料库
                </button>
            </form>
        </section>

        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-md font-bold text-gray-800 mb-3">🔑 員工帳號與密碼管理</h2>
            <div id="chefAccountsContainer" class="space-y-2 text-sm text-gray-700 max-h-40 overflow-y-auto"></div>
            <form id="addChefForm" onsubmit="handleAddChef(event)" class="grid grid-cols-2 gap-2 mt-3">
                <input type="text" id="newChefName" placeholder="员工姓名" required class="p-2 border border-gray-200 rounded-md text-xs focus:outline-none focus:ring-1 focus:ring-teal-500">
                <input type="text" id="newChefPass" placeholder="密碼" required class="p-2 border border-gray-200 rounded-md text-xs focus:outline-none focus:ring-1 focus:ring-teal-500">
                <button type="submit" class="col-span-2 bg-teal-600 text-white text-xs py-1.5 px-3 rounded-md hover:bg-teal-700 transition font-bold">新增/修改员工密碼</button>
            </form>
        </section>

        <section>
            <div class="flex justify-between items-center mb-3">
                <h2 id="txt-summary" class="text-md font-bold text-gray-800">📦 待處理彙總</h2>
                <button id="btn-export" onclick="exportOrders()" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-md hover:bg-blue-700 transition">
                    匯出採購單
                </button>
            </div>
            <div id="adminOrdersContainer" class="space-y-3"></div>
        </section>

        <hr class="border-gray-200 my-2">

        <section>
            <h2 id="txt-db" class="text-md font-bold text-gray-800 mb-3">🗄️ 物料資料庫</h2>
            <div id="adminItemsContainer" class="space-y-2"></div>
        </section>

    </main>

            opts = opts || {};
            return fetch(SUPABASE_URL + '/rest/v1/' + path, {
                method: opts.method || 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': opts.prefer || 'return=minimal'
                },
                body: opts.body || undefined
            });
        }

        let isAdminLoggedIn = false;
        const ADMIN_PASS = "admin123";

        let database = [];

            try {
                const [itemsRes, ordersRes, chefsRes] = await Promise.all([
                    sbFetch('cucina_items?restaurant_id=eq.' + RESTAURANT_ID + '&select=*&order=id'),
                    sbFetch('cucina_orders?restaurant_id=eq.' + RESTAURANT_ID + '&select=*&order=created_at.desc'),

                const items = await itemsRes.json();
                const orders = await ordersRes.json();
                const chefs = await chefsRes.json();

                database = items.map(function(r) {
                    return {
                        id: r.id, item_code: r.item_code||'', name: r.name||'', italian: r.italian||'',
                        spec: r.spec||'', price: r.price||'', supplier: r.supplier||'', model_no: r.model_no||'',
                        departments: r.departments || ['廚房'],
                        cycle: r.cycle || ['星期一'],
                        stock: r.stock||'1', safety: r.safety||'1',
                        need: '', checked: false, category: r.category || '其他',
                        chef: r.chef || ''
                    };
                });

                pendingOrders = orders.map(function(r) {
                    return { id: r.id, chef: r.chef, date: r.date, items: r.items || [], status: r.status };
                });

                chefAccounts = {};
                chefs.forEach(function(c) { chefAccounts[c.name] = c.password; });

                updateLoginSelect();
                changeLanguage();
                renderFormOptions();
            } catch(e) {
                console.error('loadAllData error:', e);
                alert('Errore di connessione al database');
            }
        }

        async function handleAddChef(event) {
            event.preventDefault();
            const name = document.getElementById('newChefName').value.trim();
            const pass = document.getElementById('newChefPass').value.trim();
            if (!name || !pass) return;
            try {
                // 检查是否已存在
                const chkRes = await sbFetch('cucina_chefs?restaurant_id=eq.'+RESTAURANT_ID+'&name=eq.'+encodeURIComponent(name));
                const chkData = await chkRes.json();
                if (chkData && chkData.length > 0) {
                    await sbFetch('cucina_chefs?restaurant_id=eq.'+RESTAURANT_ID+'&name=eq.'+encodeURIComponent(name), {
                        method: 'PATCH', body: JSON.stringify({password: pass})
                    });
                } else {
                    await sbFetch('cucina_chefs', {
                        method: 'POST', body: JSON.stringify({restaurant_id: RESTAURANT_ID, name: name, password: pass})
                    });
                }
                chefAccounts[name] = pass;
                document.getElementById('addChefForm').reset();
                renderChefAccounts();
                updateLoginSelect();
                alert(`已新增/修改员工：${name}`);
            } catch(e) { alert('錯誤: ' + e.message); }
        }

        async function deleteChef(name) {
            if (!confirm('删除員工 '+name+' ？')) return;
            try {
                await sbFetch('cucina_chefs?restaurant_id=eq.'+RESTAURANT_ID+'&name=eq.'+encodeURIComponent(name), {method: 'DELETE'});
                delete chefAccounts[name];
                renderChefAccounts();
                updateLoginSelect();
            } catch(e) { alert('錯誤: ' + e.message); }
        }

        // --- 员工端邏輯 ---
        function renderChefItems(data) {
            const container = document.getElementById('chefItemsContainer');
            container.innerHTML = '';
            
            // 將登入員工的貨物置於最前
            const sortedData = [...data].sort((a, b) => {
                const aIsChef = a.chef === loggedInChef;

                if (!aIsChef && bIsChef) return 1;
                return 0;
            });

            sortedData.forEach(item => {
                const card = document.createElement('div');

                const cycleList = item.cycle ? item.cycle.join('、') : '-';

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-bold text-gray-800">${item.name}</h3>
                            <p class="text-xs text-gray-400">原名: ${item.italian}</p>
                            <p class="text-xs text-gray-500 mt-0.5">規格: ${item.spec} | 廚師: ${item.chef}</p>
                            <span class="inline-block bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded mt-1">${cycleList}</span>
                            <div class="mt-1 flex flex-wrap gap-1 items-center">
                                ${item.departments.map(d => `<span class="bg-teal-50 text-teal-700 font-medium text-[10px] px-1 rounded">${d}</span>`).join('')}
                                <span class="bg-orange-50 text-orange-700 font-medium text-[10px] px-1 rounded">類別: ${categoryStr}</span>
                            </div>
                        </div>
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${item.id})" 
                               class="w-5 h-5 text-teal-600 border-gray-300 rounded focus:ring-teal-500">
                    </div>
                    <div class="grid grid-cols-2 gap-3 mt-3">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">目前庫存</label>
                            <input type="number" value="${item.stock}" onchange="updateStock(${item.id}, this.value)" 
                                   class="w-full p-2 border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-teal-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">本次申購數量</label>
                            <input type="number" placeholder="0" value="${item.need}" onchange="updateNeed(${item.id}, this.value)"

        function updateStock(id, value) {
            const item = database.find(i => i.id === id);
            if (item) item.stock = value;
        }

        function updateNeed(id, value) {
            const item = database.find(i => i.id === id);
            if (item) {
                item.need = value;
                if (value && value > 0) {
                    item.checked = true;
                    renderChefItems(database);
                }
            }
        }

        function toggleCheck(id) {
            const item = database.find(i => i.id === id);
            if (item) {
                item.checked = !item.checked;
                renderChefItems(database);
            }
        }

        function updateSelectedCount() {
            const checkedCount = database.filter(i => i.checked).length;
            document.getElementById('selectedCount').innerText = checkedCount;
        }

        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = database.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.italian.toLowerCase().includes(query) || 
                item.chef.toLowerCase().includes(query) ||
                (item.departments && item.departments.some(d => d.toLowerCase().includes(query)))
            );
            renderChefItems(filtered);
        }

        function sortChefItems() {
            const sortType = document.getElementById('sortSelect').value;
            let sortedData = [...database];

            if (sortType === 'name') {
                sortedData.sort((a, b) => a.name.localeCompare(b.name, 'zh-TW'));
            } else if (sortType === 'chef') {
                sortedData.sort((a, b) => a.chef.localeCompare(b.chef, 'zh-TW'));
            } else if (sortType === 'category') {
                sortedData.sort((a, b) => (a.category || '').localeCompare(b.category || '', 'zh-TW'));
            } else {
                sortedData = [...database];
            }
            renderChefItems(sortedData);
        }

        function clearSelection() {
            database.forEach(item => {
                item.checked = false;
                item.need = "";
            });
            renderChefItems(database);
        }

        async function submitOrder() {
            const selected = database.filter(item => item.checked);
            if (selected.length === 0) {
                alert("请先选择或填写需要补货的物料！");
                return;
            }

            // 按进货单位排序
            selected.sort(function(a, b) {
                return (a.supplier||'').localeCompare(b.supplier||'');
            });
            const orderItems = selected.map(i => ({
                item_code: i.item_code || '',
                name: i.name || i.italian || '',
                supplier: i.supplier || '',
                spec: i.spec || '',
                need: i.need
            }));
            const chefName = loggedInChef || "張師傅";

            // 在系統內部暫存
            const newOrder = {
                restaurant_id: RESTAURANT_ID,
                chef: chefName,
                date: new Date().toISOString().slice(0, 10),
                items: orderItems,
                status: "待處理"
            };
            try {
                const res = await sbFetch('cucina_orders', {method: 'POST', prefer: 'return=representation', body: JSON.stringify(newOrder)});
                const saved = await res.json();
                const savedId = saved && saved[0] ? saved[0].id : pendingOrders.length + 1;
                pendingOrders.unshift({id: savedId, chef: chefName, date: newOrder.date, items: orderItems, status: "待處理"});
            } catch(e) { console.error('submitOrder error:', e); }
            
            // 組合 WhatsApp 訊息格式
            let message = `🍳 *后厨申购与管理系统*\n` +
                          `🧑‍🍳 提报人: ${chefName}\n` +
                          `📅 日期: ${new Date().toISOString().slice(0, 10)}\n\n` +
                          `📦 采购清单:\n`;
            
            // 按供应商分组输出
            let currentSupplier = null;
            orderItems.forEach(i => {
                if (i.supplier && i.supplier !== currentSupplier) {
                    currentSupplier = i.supplier;
                    message += `\n📦 ${i.supplier.toUpperCase()}\n`;
                }
                const code = i.item_code ? i.item_code + ' / ' : '';
                const sup = i.supplier ? '/' + i.supplier.toUpperCase() : '';
                const spec = i.spec ? ' ' + i.spec : '';
                message += `• ${code}${i.name}${sup} = ${i.need}${spec}\n`;
            });

            const whatsappNumber = "393778826875";
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;

            alert(t('successSubmit'));
            window.open(whatsappUrl, '_blank');

            clearSelection();
            renderChefItems(database);
        }

        async function handleAddItem(event) {
            event.preventDefault();
            const itemCode = (document.getElementById('formItemCode')||{}).value || '';
            const italianName = document.getElementById('formItalianName').value;
            const itemName = document.getElementById('formItemName').value;
            const spec = document.getElementById('formSpec').value;
            const price = document.getElementById('formPrice').value;
            const supplier = (document.getElementById('formSupplier')||{}).value || '';
            const modelNo = (document.getElementById('formModelNo')||{}).value || '';
            const category = (document.getElementById('formCategory')||{}).value || '';

            const selectedDepts = [];
            document.querySelectorAll('input[name="departments"]:checked').forEach(el => {
                selectedDepts.push(el.value);
            });

            const selectedCycles = [];
            document.querySelectorAll('input[name="cycles"]:checked').forEach(el => {
                selectedCycles.push(el.value);
            });

            const displayName = itemName || italianName;
            const newItem = {
                restaurant_id: RESTAURANT_ID,
                item_code: itemCode,
                name: itemName, italian: italianName, spec: spec,
                price: price, supplier: supplier, model_no: modelNo,
                departments: selectedDepts.length > 0 ? selectedDepts : ['廚房'],
                cycle: selectedCycles.length > 0 ? selectedCycles : ['星期一'],
                stock: '1', safety: '1', category: category
            };
            try {
                const res = await sbFetch('cucina_items', {method: 'POST', prefer: 'return=representation', body: JSON.stringify(newItem)});
                const saved = await res.json();
                database.push(Object.assign({id: saved[0].id, need: '', checked: false, chef: ''}, newItem));
                document.getElementById('addItemForm').reset();
                alert('✅ 已新增：' + displayName);
                AdminModeInit();
            } catch(e) { alert('錯誤: ' + e.message); }
        }

        async function processOrder(id) {
            const order = pendingOrders.find(o => o.id === id);
            if (order) {
                try {
                    await sbFetch('cucina_orders?id=eq.'+id, {method: 'PATCH', body: JSON.stringify({status: '已確認'})});
                    order.status = '已確認';
                    renderAdminOrders();
                } catch(e) { alert('錯誤: ' + e.message); }
            }
        }

        function exportOrders() {
            const activeOrders = pendingOrders.filter(o => o.status === '待處理');
            if (activeOrders.length === 0) {
                alert(t('noExportData'));
                return;
            }
            
            let exportStr = "后厨采购清单\n==================\n";
            activeOrders.forEach(o => {
                exportStr += `\n提报人: ${o.chef} (${o.date})\n`;
                o.items.forEach(i => {
                    exportStr += `- ${i.name}: ${i.need}\n`;
                });
            });

            const blob = new Blob([exportStr], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `採購單_${new Date().toISOString().slice(0, 10)}.txt`;
            link.click();
        }

        async function editItem(id) {
            const item = database.find(i => i.id === id);
            if (item) {
                const newStock = prompt(`修改物料"${item.name}"的目前庫存:`, item.stock);
                if (newStock !== null) {
                    try {
                        await sbFetch('cucina_items?id=eq.'+id, {method: 'PATCH', body: JSON.stringify({stock: newStock})});
                        item.stock = newStock;
                        renderAdminItems();
                    } catch(e) { alert('錯誤: ' + e.message); }
                }
            }
        }
        // --- 批量导入函數 ---
        async function saveImportedToSupabase() {
            if (!_pendingImport || _pendingImport.length === 0) { alert('沒有待保存的資料'); return; }
            const btn = document.querySelector('#import-save-area button');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ 保存中...'; }
            let count = 0;
            for (const item of _pendingImport) {
                try {
                    // upsert：货物号相同则更新，否则插入
                    const res = await fetch(SUPABASE_URL + '/rest/v1/cucina_items', {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_KEY,
                            'Content-Type': 'application/json',
                            'Prefer': 'resolution=merge-duplicates,return=representation'
                        },
                        body: JSON.stringify(item)
                    });
                    const saved = await res.json();
                    count++;
                } catch(e) { console.error('save error:', e); }
            }
            // 重新从Supabase加载
            await loadAllData();
            _pendingImport = [];
            const saveArea = document.getElementById('import-save-area');
            if (saveArea) saveArea.classList.add('hidden');
            if (btn) { btn.disabled = false; btn.textContent = '💾 保存到 Supabase'; }
            alert('✅ 成功保存 ' + count + ' 筆物料到資料庫！');
            AdminModeInit();
        }

        function handleFileImport(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                _pendingImport = [];
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    const itemCode    = row[0] !== undefined ? String(row[0]).trim() : '';
                    const italianName = row[1] || '';
                    const chineseName = row[2] || '';
                    const spec        = row[3] ? String(row[3]).trim() : '';
                    const priceVal    = row[4];
                    const price       = typeof priceVal === 'number' ? priceVal.toFixed(2) : parseFloat((priceVal || '').toString().replace(',', '.')) || 0;
                    const supplier    = row[5] ? String(row[5]).trim() : '';
                    const modelNo     = row[6] ? String(row[6]).trim() : '';
                    const deptRaw     = row[7] || '';
                    let departments   = ['廚房'];
                    if (deptRaw) departments = deptRaw.toString().split('/').map(d => d.trim());
                    const category    = row[8] ? String(row[8]).trim() : '其他';
                    const chefName    = row[9] ? String(row[9]).trim() : '';
                    _pendingImport.push({
                        restaurant_id: RESTAURANT_ID,
                        item_code: itemCode,
                        name: chineseName, italian: italianName, spec: spec,
                        price: String(price), supplier: supplier, model_no: modelNo,
                        departments: departments, cycle: ['星期一'],
                        stock: '1', safety: '1', category: category, chef: chefName
                    });
                }
                // 显示保存按钮
                const saveArea = document.getElementById('import-save-area');
                const previewMsg = document.getElementById('import-preview-msg');
                if (saveArea) saveArea.classList.remove('hidden');
                if (previewMsg) previewMsg.textContent = '已解析 ' + _pendingImport.length + ' 筆物料，點擊下方按鈕保存到資料庫。';
            };

            reader.readAsArrayBuffer(file);
        }

        function downloadFrontend() {
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Kitchen_App_${new Date().toISOString().slice(0, 10)}.html`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // --- 初始化執行 ---
        // 初始顯示員工登入頁
        document.getElementById('view-chef').classList.add('hidden');
        document.getElementById('view-admin').classList.add('hidden');
        document.getElementById('view-admin-login').classList.add('hidden');
        document.getElementById('view-chef-login').classList.remove('hidden');
        // 从Supabase加载数据
        loadAllData();
    </script>
</body>
</html>
