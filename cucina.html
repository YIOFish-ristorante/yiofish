<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>已搬迁 → yki.it/cucina.html</title>
<link rel="canonical" href="https://yki.it/cucina.html">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #faf6ed 0%, #f0e8d4 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    color: #2c2418; padding: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .box {
    max-width: 460px; padding: 36px 30px; background: #fff;
    border-radius: 18px; box-shadow: 0 6px 30px rgba(180, 150, 100, 0.15);
    text-align: center;
  }
  .icon { font-size: 56px; margin-bottom: 12px; }
  h1 { color: #c9a961; font-size: 22px; margin-bottom: 14px; font-weight: 600; }
  .desc { color: #5a4f3a; font-size: 15px; line-height: 1.6; margin-bottom: 22px; }
  .url-box {
    background: #f9f3e0; padding: 14px 16px; border-radius: 10px;
    color: #8a6f3a; font-family: monospace; font-size: 14px;
    word-break: break-all; margin: 16px 0;
  }
  .countdown { color: #8a7858; font-size: 13px; margin-top: 18px; }
  .btn {
    display: inline-block; margin-top: 18px; padding: 12px 28px;
    background: linear-gradient(135deg, #c9a961 0%, #b3924c 100%);
    color: #fff; text-decoration: none; border-radius: 10px;
    font-weight: 600; font-size: 15px; letter-spacing: 0.5px;
  }
  .btn:hover { box-shadow: 0 4px 12px rgba(201, 169, 97, 0.35); }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🚀</div>
    <h1>YIO CucinaFlow 已搬迁</h1>
    <p class="desc">
      请使用新地址访问 cucina 系统：<br>
      <strong style="color:#c9a961;">yki.it</strong>
    </p>
    <div class="url-box" id="target-url">yki.it/cucina.html</div>
    <p class="countdown" id="countdown">2 秒后自动跳转...</p>
    <a class="btn" id="manual-link" href="https://yki.it/cucina.html">立即跳转</a>
    <p style="margin-top:16px;font-size:12px;color:#a89878;">
      请更新书签：<strong>yki.it/cucina.html</strong>
    </p>
  </div>
<script>
(function(){
  // 保留 URL 参数（比如 ?r=carpi）
  const params = new URLSearchParams(window.location.search);
  const targetBase = 'https://yki.it/cucina.html';
  const target = params.toString() ? targetBase + '?' + params.toString() : targetBase;
  document.getElementById('manual-link').href = target;
  document.getElementById('target-url').textContent = target.replace('https://', '');
  // 1.5 秒后跳转（给用户看到信息）
  let countdown = 2;
  const cdEl = document.getElementById('countdown');
  const timer = setInterval(function(){
    countdown--;
    if (countdown <= 0) {
      cdEl.textContent = '正在跳转...';
      clearInterval(timer);
      window.location.replace(target);
    } else {
      cdEl.textContent = countdown + ' 秒后自动跳转...';
    }
  }, 1000);
})();
</script>
</body>
</html>
