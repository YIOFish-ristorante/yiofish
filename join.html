<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>已搬迁 → yki.it/join.html</title>
<link rel="canonical" href="https://yki.it/join.html">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #faf6ed 0%, #f0e8d4 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    color: #2c2418; padding: 20px;
  }
  .box {
    max-width: 460px; padding: 36px 30px; background: #fff;
    border-radius: 18px; box-shadow: 0 6px 30px rgba(180, 150, 100, 0.15);
    text-align: center;
  }
  .icon { font-size: 56px; margin-bottom: 12px; }
  h1 { color: #c9a961; font-size: 22px; margin-bottom: 14px; font-weight: 600; }
  .desc { color: #5a4f3a; font-size: 15px; line-height: 1.6; margin-bottom: 22px; }
  .btn {
    display: inline-block; margin-top: 18px; padding: 12px 28px;
    background: linear-gradient(135deg, #c9a961 0%, #b3924c 100%);
    color: #fff; text-decoration: none; border-radius: 10px;
    font-weight: 600; font-size: 15px;
  }
  .countdown { color: #8a7858; font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🏠</div>
    <h1>CucinaFlow 已搬迁</h1>
    <p class="desc">
      新的官网地址：<br>
      <strong style="color:#c9a961;">yki.it</strong>
    </p>
    <p class="countdown" id="countdown">2 秒后自动跳转...</p>
    <a class="btn" href="https://yki.it/">立即跳转</a>
  </div>
<script>
let countdown = 2;
const cdEl = document.getElementById('countdown');
const timer = setInterval(function(){
  countdown--;
  if (countdown <= 0) {
    clearInterval(timer);
    window.location.replace('https://yki.it/');
  } else {
    cdEl.textContent = countdown + ' 秒后自动跳转...';
  }
}, 1000);
</script>
</body>
</html>
