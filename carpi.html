<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YIO Fish · Carpi</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YIO Fish">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ── 变量 ── */
:root {
  --gold: #bfa46f;
  --gold-lt: #e2c87a;
  --gold-dk: #8a6e2a;
  --gold-dim: rgba(191,164,111,0.12);
  --bg: #000;
  --bg2: #0c0b09;
  --surface: #111;
  --surface2: #1a1a1a;
  --card: #1a1710;
  --card2: #201d14;
  --border: #2a2a2a;
  --border2: rgba(255,255,255,.13);
  --text: #fff;
  --text2: #ede5d4;
  --muted: #555;
  --muted2: #7a7060;
  --red: #c0392b;
  --accent: #8e44ad;
  --radius: 14px;
  --r: 3px;
  --nav-h: 52px;
  --transition: 0.22s cubic-bezier(.4,0,.2,1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow: hidden; width: 100%; height: 100%; }
body {
  min-height: 100vh;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "DM Sans", sans-serif;
  color: var(--text);
  overflow-x: hidden;
  overflow-y: auto;
  position: relative;
  width: 100%;
  height: 100%;
  -webkit-font-smoothing: antialiased;
}

/* ── 首页 ── */
#home-view {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  width: 92%;
  max-width: 420px;
  padding: 40px 20px 30px;
  display: flex;
  flex-direction: column;
  text-align: center;
}
.logo-wrap {
  margin: 0 auto 24px;
  width: 160px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.logo-wrap img { width: 100%; height: auto; display: block; filter: brightness(1.1); }
.gold-line { width: 48px; height: 1px; background: var(--gold); margin: 0 auto 24px; opacity: .5; }
.status {
  color: var(--gold);
  letter-spacing: 2px;
  font-size: 11px;
  margin-bottom: 18px;
  transition: color var(--transition);
  min-height: 16px;
}
.status.closed { color: var(--muted); }
.status.closing { color: var(--red); }
.timer-banner {
  display: none;
  background: var(--gold-dim);
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 12px 16px;
  margin-bottom: 18px;
  border-radius: var(--radius);
  font-size: 12px;
  letter-spacing: 1px;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:.65} 50%{opacity:1} }
.action-row { display: flex; gap: 10px; margin-bottom: 12px; }
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 17px 0;
  margin-bottom: 10px;
  border-radius: var(--radius);
  border: none;
  font-weight: 600;
  text-decoration: none;
  letter-spacing: 2px;
  font-size: 12px;
  cursor: pointer;
  transition: opacity var(--transition), transform var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.btn:active { opacity: .75; transform: scale(.97); }
.btn-gold { background: var(--gold); color: #000; }
.btn-ghost {
  flex: 1;
  margin-bottom: 0;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  font-weight: 400;
}
.menu-btn { display: none; }
.social-row {
  display: flex;
  justify-content: space-around;
  align-items: center;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 50px; height: 50px;
  border-radius: 50%;
  border: 1px solid var(--border);
  text-decoration: none;
  transition: border-color var(--transition), background var(--transition), transform var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.icon-btn svg { width: 22px; height: 22px; fill: var(--gold); }
.icon-btn:active { background: var(--gold-dim); border-color: var(--gold); transform: scale(.9); }
.footer { margin-top: 24px; font-size: 10px; color: var(--muted); letter-spacing: 1px; line-height: 1.8; }

/* ── 菜单视图 ── */
#menu-view { display: none; min-height: 100vh; background: var(--bg2); }

/* 菜单头部 */
.mhdr {
  position: relative;
  background: var(--surface);
  padding: 32px 24px 26px;
  text-align: center;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
}
.mhdr-glow {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 70% 55% at 50% -5%, rgba(200,168,76,.14) 0%, transparent 70%);
}

.mhdr-logo {
  width: 220px; height: 80px;
  margin: 0 auto 14px;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.mhdr-logo img { width: 100%; height: 100%; object-fit: contain; }
.mhdr-badge {
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 14px; padding: 4px 14px;
  font-size: 11px; letter-spacing: 2px; color: #fff;
  margin-bottom: 12px; text-transform: uppercase;
}
.mhdr-div { display: flex; align-items: center; gap: 14px; justify-content: center; margin-bottom: 10px; }
.mhdr-line { width: 44px; height: 1px; background: linear-gradient(90deg,transparent,var(--gold),transparent); }
.mhdr-dot { width: 5px; height: 5px; background: var(--gold); transform: rotate(45deg); }
.mhdr-info { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; font-size: 11px; color: var(--muted2); }

/* Toast提示 */
#toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(30,25,18,.95); border: 1px solid rgba(212,171,72,.3);
  color: #f4f1ec; padding: 10px 20px; border-radius: 20px;
  font-size: 13px; letter-spacing: .5px; z-index: 9999;
  opacity: 0; transition: opacity .2s; pointer-events: none;
  white-space: nowrap; max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; }

/* 底部工具栏 */
.toolbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 14px;
  display: flex; gap: 10px; align-items: center;
  box-shadow: 0 -4px 20px rgba(0,0,0,.4);
}
.srch {
  flex: 1; display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.04); border: 1px solid var(--border2);
  border-radius: var(--r); padding: 0 12px; height: 40px;
}
.srch svg { color: var(--muted2); flex-shrink: 0; }
.srch input { background: none; border: none; outline: none; color: var(--text2); font-family: inherit; font-size: 14px; width: 100%; }
.srch input::placeholder { color: var(--muted2); }
.srch-x { background: none; border: none; color: var(--muted2); font-size: 18px; padding: 0 2px; display: none; cursor: pointer; }
.srch-x.on { display: block; }
.cart-fab {
  position: relative; background: var(--gold); border: none;
  border-radius: var(--r); width: 44px; height: 40px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .15s; margin-right: 6px;
}
.cart-fab:hover { background: var(--gold-lt); }
.cart-fab svg { color: #0c0b09; }
.back-fab {
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--r); width: 44px; height: 40px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .15s; margin-left: 0;
  -webkit-tap-highlight-color: transparent;
}
.back-fab:hover { background: var(--gold-dim); border-color: var(--gold); }
.back-fab svg { color: var(--gold); }
.cbadge {
  position: absolute; top: 2px; right: 2px;
  background: var(--red); color: #fff; font-size: 10px; font-weight: 500;
  min-width: 16px; height: 16px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; padding: 0 3px;
  opacity: 0; transform: scale(0);
  transition: all .2s cubic-bezier(.34,1.56,.64,1);
}
.cbadge.on { opacity: 1; transform: scale(1); }

/* 分类导航 */
.catnav {
  background: var(--surface); border-bottom: 1px solid var(--border);
  overflow-x: auto; white-space: nowrap; scrollbar-width: none;
  padding: 0 8px; position: sticky; top: 0; z-index: 190;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.catnav::-webkit-scrollbar { display: none; }
.catnav-inner { display: inline-flex; }
.cbtn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 16px; height: var(--nav-h); font-size: 13px; font-weight: 300;
  color: var(--muted2); background: none; border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer; white-space: nowrap;
  transition: color .18s, border-color .18s;
}
.cbtn:hover { color: var(--text2); }
.cbtn.active { color: var(--gold); border-bottom-color: var(--gold); }

/* 菜品卡片 */
main { max-width: 960px; margin: 0 auto; padding: 28px 16px 170px; }
.shead { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; margin-top: 36px; }
.shead:first-child { margin-top: 0; }
.shead h2 { font-family: "Cormorant Garamond", serif; font-size: 24px; font-weight: 400; letter-spacing: 2px; white-space: nowrap; }
.sline { flex: 1; height: 1px; background: var(--border); }
.scnt { font-size: 11px; color: var(--muted2); white-space: nowrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  overflow: hidden; display: flex; flex-direction: column;
  animation: fu .35s ease both;
  transition: transform .2s, box-shadow .2s, border-color .2s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 14px 48px rgba(0,0,0,.5); border-color: rgba(200,168,76,.22); }
.card.so { opacity: .35; pointer-events: none; }
@keyframes fu { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
.cimg { position: relative; aspect-ratio: 16/10; overflow: hidden; background: #100f09; flex-shrink: 0; min-height: 80px; }
.cimg img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
.card:hover .cimg img { transform: scale(1.06); }
.cph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 44px; background: linear-gradient(135deg, var(--card2), var(--card)); }
.scbadge { position: absolute; bottom: 8px; left: 8px; background: #27ae60; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
.mqbadge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.72); color: var(--gold); font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--gold); }
.sbadge { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: 3px; color: #fff; text-transform: uppercase; }
.cbody { padding: 12px; display: flex; flex-direction: column; flex: 1; gap: 6px; }
.ctags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: 1px; font-size: 12px; border: 1px solid currentColor; opacity: .8; }
.cname { font-family: "Cormorant Garamond", serif; font-size: 17px; font-weight: 400; color: var(--text2); line-height: 1.25; }
.cdesc { font-size: 14px; color: var(--muted2); line-height: 1.65; flex: 1; }
.cfoot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); overflow: hidden; min-width: 0; }
.cprice { font-family: "Cormorant Garamond", serif; font-size: 20px; font-weight: 300; color: var(--gold); flex: 1; min-width: 0; overflow: hidden; }
.cprice .sym { font-size: 14px; }
.add-btn { width: 34px; height: 34px; background: var(--gold); border: none; border-radius: var(--r); color: #0c0b09; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s, transform .1s; }
.add-btn:hover { background: var(--gold-lt); }
.add-btn:active { transform: scale(.92); }
.qctrl { display: flex; align-items: center; border: 1px solid var(--gold-dk); border-radius: var(--r); overflow: hidden; flex-shrink: 0; }
.qbtn { width: 32px; height: 34px; background: none; border: none; color: var(--gold); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
.qbtn:hover { background: rgba(200,168,76,.12); }
.qnum { min-width: 28px; text-align: center; font-size: 14px; color: var(--text2); user-select: none; }

/* 购物车抽屉 */
.cov { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 900; opacity: 0; pointer-events: none; transition: opacity .25s; }
.cov.on { opacity: 1; pointer-events: all; }
.cdr {
  position: fixed; right: 0; top: 0; bottom: 0;
  width: 100%; max-width: min(440px, 100vw);
  background: var(--surface); border-left: 1px solid var(--border);
  z-index: 910; display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
}
.cdr.on { transform: translateX(0); }
.chd { padding: 16px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.chd h2 { font-family: "Cormorant Garamond", serif; font-size: 22px; font-weight: 300; letter-spacing: 2px; }
.ccls { background: none; border: none; color: var(--muted2); font-size: 24px; padding: 4px; cursor: pointer; }
.cbdy { flex: 1; overflow-y: auto; padding: 8px 0; }
.cempty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted2); gap: 12px; }
.ci { display: flex; gap: 6px; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); overflow: hidden; }
.ci-th { width: 44px; height: 44px; flex-shrink: 0; border-radius: 2px; overflow: hidden; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.ci-th img { width: 100%; height: 100%; object-fit: cover; }
.ci-info { flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.ci-name { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.ci-price { font-size: 11px; color: var(--gold); white-space: nowrap; }
.ci-qty { display: flex; align-items: center; border: 1px solid var(--border2); border-radius: var(--r); overflow: hidden; flex-shrink: 0; }
.ci-qty .qbtn { width: 26px; height: 28px; font-size: 15px; }
.ci-qty .qnum { min-width: 22px; font-size: 12px; }
.cft { border-top: 1px solid var(--border); padding: 16px 14px 28px; }
.csub { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.csub span:first-child { font-size: 12px; color: var(--muted2); }
.ctotal { font-family: "Cormorant Garamond", serif; font-size: 28px; font-weight: 300; color: var(--gold); }
.cinfo { font-size: 11px; color: var(--muted2); line-height: 1.6; margin: 10px 0 16px; }
.cinfo strong { color: var(--text2); font-weight: 400; }

/* 购物车按钮 */
.obtn {
  width: 100%; background: var(--gold); border: none; border-radius: var(--r);
  padding: 14px; font-family: "Cormorant Garamond", serif;
  font-size: 16px; letter-spacing: 3px; color: #0c0b09;
  cursor: pointer; transition: background .15s; margin-bottom: 8px;
}
.obtn:hover { background: var(--gold-lt); }
.obtn:disabled { background: var(--muted); color: #333; cursor: default; }
.obtn-notify {
  width: 100%; background: var(--surface2); border: 1px solid var(--gold);
  border-radius: var(--r); padding: 12px;
  font-family: "Cormorant Garamond", serif;
  font-size: 14px; letter-spacing: 2px; color: var(--gold);
  cursor: pointer; transition: background .15s; margin-bottom: 8px;
  display: none;
}
.obtn-notify:hover { background: var(--gold-dim); }
.obtn-notify:disabled { border-color: var(--muted); color: var(--muted); cursor: default; }
.clr { width: 100%; background: none; border: 1px solid var(--border2); border-radius: var(--r); color: var(--muted2); padding: 10px; font-size: 13px; margin-top: 4px; cursor: pointer; }
.clr:hover { border-color: var(--muted2); color: var(--text2); }

/* 桌号输入 */
.table-input-wrap { margin-bottom: 12px; }
.table-input-wrap label { display: block; font-size: 11px; color: var(--muted2); margin-bottom: 4px; letter-spacing: .3px; }
.table-input-wrap input {
  width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--border2);
  border-radius: var(--r); padding: 9px 11px; font-size: 13px; color: var(--text2);
  outline: none;
}
.table-input-wrap input:focus { border-color: var(--gold); }

/* 空结果 */
.nores { text-align: center; padding: 80px 20px; color: var(--muted2); }
.nores h3 { font-family: "Cormorant Garamond", serif; font-size: 22px; font-weight: 300; color: var(--text2); margin-bottom: 6px; }

/* 加载动画 */
#loading-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
}
.loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(191,164,111,.2); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.loading-text { color: var(--gold); font-size: 13px; letter-spacing: 2px; }

/* 弹窗 */
.overlay { position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.85); z-index: 999; backdrop-filter: blur(6px); }
.overlay.open { display: flex; }
.sheet { background: var(--surface); border-radius: 24px 24px 0 0; padding: 28px 24px 40px; width: 100%; max-width: 480px; border: 1px solid var(--border); border-bottom: none; text-align: center; animation: slideUp .28s cubic-bezier(.4,0,.2,1); }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.sheet h3 { color: var(--gold); font-weight: 300; letter-spacing: 3px; font-size: 14px; margin-bottom: 22px; }
.drag-bar { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 22px; }
.form-field { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 16px; -webkit-appearance: none; color-scheme: dark; transition: border-color var(--transition); }
.form-field:focus { outline: none; border-color: var(--gold); }
.form-field::placeholder { color: #444; }
.date-wrap { position: relative; width: 100%; margin-bottom: 10px; }
.date-wrap input[type="date"] { width: 100%; margin-bottom: 0; padding-top: 22px; padding-bottom: 8px; }
.date-wrap label { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); font-size: 16px; color: #444; pointer-events: none; transition: top .18s, font-size .18s, color .18s; }
.date-wrap input[type="date"]:focus + label, .date-wrap input[type="date"]:valid + label { top: 10px; font-size: 10px; color: var(--gold); letter-spacing: 1px; }
.notice { font-size: 12px; color: var(--gold); margin-bottom: 10px; font-weight: 600; letter-spacing: 1px; min-height: 18px; }
.btn-close { margin-top: 16px; background: transparent; color: var(--muted); border: none; font-size: 13px; letter-spacing: 1px; cursor: pointer; padding: 10px; width: 100%; }

/* 管理员弹窗 */
.admin-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.92); z-index: 1000; backdrop-filter: blur(8px); }
.admin-overlay.open { display: flex; }
.admin-box { background: var(--surface); border-radius: 20px; padding: 32px 28px; width: 85%; max-width: 320px; border: 1px solid var(--border); text-align: center; animation: fadeScale .22s cubic-bezier(.4,0,.2,1); }
@keyframes fadeScale { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }
.admin-box h4 { color: var(--gold); letter-spacing: 2px; font-size: 13px; font-weight: 400; margin-bottom: 20px; }
.pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 24px; }
.pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); background: transparent; transition: background .15s, border-color .15s; }
.pin-dot.filled { background: var(--gold); border-color: var(--gold); }
.keypad { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.key { padding: 18px 0; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 20px; font-weight: 300; cursor: pointer; transition: background var(--transition), transform var(--transition); -webkit-tap-highlight-color: transparent; user-select: none; }
.key:active { background: var(--gold-dim); transform: scale(.93); }
.key.del { color: var(--gold); font-size: 14px; letter-spacing: 1px; }
.key.empty { pointer-events: none; background: transparent; border-color: transparent; }
.admin-error { color: var(--red); font-size: 12px; letter-spacing: 1px; margin-top: 12px; min-height: 18px; }

<script>
// ════════════════════════════════════
// Supabase 配置
// ════════════════════════════════════
var SUPABASE_URL = 'https://cnavkgfrqvfuafcbmldg.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuYXZrZ2ZycXZmdWFmY2JtbGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MTE1MjIsImV4cCI6MjA5MzA4NzUyMn0.JX0ECOAVy-BVklCSsJE5n3j-owz1Ti-GOV4MtrWYlPI';
var RESTAURANT_ID = 'carpi';

function sbFetch(path, opts) {
  opts = opts || {};
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: opts.method || 'GET',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=minimal'
    },
    body: opts.body || undefined
  });
}

// ════════════════════════════════════
// 全局数据
// ════════════════════════════════════
var R = {name:"Yio Fish", subtitle:"Ristorante Giapponese · Carpi", phone:"339 140 6020", address:"Viale dell’Industria, 19 — 41012 Carpi (MO)", hours:"Lun–Dom: 12:00–15:00 / 17:00–23:30"};
var CATS = [];
var ALL_ITEMS = [];
var DISH_MENUS = [];
var SETTINGS = {notify_enabled: false, takeaway_enabled: true, is_open: true};
var TAGS = {"1":{"label":"Glutine","color":"#95a5a6","icon":"🌾"},"2":{"label":"Crostacei","color":"#2980b9","icon":"🦐"},"3":{"label":"Uova","color":"#f39c12","icon":"🥚"},"4":{"label":"Pesce","color":"#3498db","icon":"🐟"},"6":{"label":"Soia","color":"#16a085","icon":"🫘"},"7":{"label":"Latte","color":"#f1c40f","icon":"🥛"},"8":{"label":"Frutta a guscio","color":"#e74c3c","icon":"🌰"},"11":{"label":"Sesamo","color":"#e67e22","icon":"🌱"},"14":{"label":"Molluschi","color":"#2980b9","icon":"🦑"},"piccante":{"label":"Piccante","color":"#c0392b","icon":"🌶"},"vegano":{"label":"Vegano","color":"#27ae60","icon":"🌿"},"new":{"label":"Novità","color":"#8e44ad","icon":"✨"}};

var MENU_CONFIGS = {}; // 从Supabase加载
var MENU_CONFIG = {
  pranzo:   {label:'Pranzo',   emoji:'☀️',  color:'#f39c12'},
  cena:     {label:'Cena',     emoji:'🌙',  color:'#8e44ad'},
  speciale: {label:'Speciale', emoji:'⭐',  color:'#c8a84c'},
  bevande:  {label:'Bevande',  emoji:'🍵',  color:'#27ae60'},
  dessert:  {label:'Dessert',  emoji:'🍡',  color:'#e91e8c'},
  asporto:  {label:'Asporto',  emoji:'📦',  color:'#e67e22'}
};

// ════════════════════════════════════
// 购物车（按菜单分开）
// ════════════════════════════════════
var cart = {};  // { itemId: qty }
var guestCount = 1;  // 人数（服务员控制）
var WAITER_PASSWORD = '5555';  // 服务员密码（从Supabase读取）
var _tableSession = null;  // 当前桌号的轮次状态
var _roundCartCount = 0;   // 本轮已点道数
var currentMenuId = null;
var isAsporto = false;

// ════════════════════════════════════
// 加载数据
// ════════════════════════════════════
async function loadAll() {
  try {
    // 并行加载
    var [rRes, sRes, cRes, dRes, mcRes] = await Promise.all([
      sbFetch('restaurants?id=eq.' + RESTAURANT_ID + '&select=*'),
      sbFetch('restaurant_settings?restaurant_id=eq.' + RESTAURANT_ID + '&select=*'),
      sbFetch('categories?select=*&order=sort_order'),
      sbFetch('dishes?select=*&order=id&limit=2000'),
      sbFetch('menu_configs?restaurant_id=eq.' + RESTAURANT_ID + '&select=*')
    ]);

    var rData = await rRes.json();
    if (rData[0]) R = rData[0];

    var sData = await sRes.json();
    if (sData[0]) {
      SETTINGS = sData[0];
      // 读取服务员密码
      if (SETTINGS.waiter_password) WAITER_PASSWORD = SETTINGS.waiter_password;
    }

    CATS = await cRes.json();
    var dishes = await dRes.json();
    var mcData = await mcRes.json();
    // 存储每个菜单的excludeCats
    MENU_CONFIGS = {};
    mcData.forEach(function(mc) {
      MENU_CONFIGS[mc.menu_id] = {
        excludeCats: mc.exclude_cats || [],
        menuLimit: mc.menu_limit || 0
      };
    });

    // dish_menus超过1000条，分3次加载
    var [dm1Res, dm2Res, dm3Res] = await Promise.all([
      sbFetch('dish_menus?restaurant_id=eq.' + RESTAURANT_ID + '&select=*&limit=1000&offset=0'),
      sbFetch('dish_menus?restaurant_id=eq.' + RESTAURANT_ID + '&select=*&limit=1000&offset=1000'),
      sbFetch('dish_menus?restaurant_id=eq.' + RESTAURANT_ID + '&select=*&limit=1000&offset=2000')
    ]);
    var dishMenus = (await dm1Res.json()).concat(await dm2Res.json()).concat(await dm3Res.json());
    DISH_MENUS = dishMenus;

    // 合并菜品和菜单价格
    ALL_ITEMS = dishes.map(function(d) {
      var menus = {};
      DISH_MENUS.filter(function(dm){ return Number(dm.dish_id) === Number(d.id); })
        .forEach(function(dm) {
          menus[dm.menu_id] = { on: dm.enabled, price: parseFloat(dm.price)||0, max_qty: parseInt(dm.max_qty)||0, sconto: parseInt(dm.sconto)||0 };
        });
      return { id: d.id, category: d.category_id, name: d.name, desc: d.description, image: d.image, tags: d.tags || [], sold_out: d.sold_out, menus: menus };
    });

    document.getElementById('loading-overlay').style.display = 'none';
    // 记录发布时间
    if (SETTINGS.published_at) _lastPublishedAt = SETTINGS.published_at;
    loadMenu();
    // 每30秒检查营业状态和新发布
    setInterval(function(){
      if (!currentMenuId) loadMenu();
      checkNewPublish();
    }, 30000);

  } catch(e) {
    document.getElementById('loading-overlay').style.display = 'none';
    console.error('Errore caricamento:', e);
    loadMenu();
  }
}

var _lastPublishedAt = null;

async function checkNewPublish() {
  try {
    var res = await sbFetch('restaurant_settings?restaurant_id=eq.' + RESTAURANT_ID + '&select=published_at,notify_enabled,takeaway_enabled,is_open');
    var data = await res.json();
    if (!data || !data[0]) return;
    var s = data[0];
    // 更新开关状态
    SETTINGS.notify_enabled = s.notify_enabled;
    SETTINGS.takeaway_enabled = s.takeaway_enabled;
    SETTINGS.is_open = s.is_open;
    // 检查是否有新发布
    if (s.published_at && s.published_at !== _lastPublishedAt) {
      _lastPublishedAt = s.published_at;
      await reloadMenuData();
    }
  } catch(e) {}
}

async function reloadMenuData() {
  try {
    var [cRes, dRes] = await Promise.all([
      sbFetch('categories?select=*&order=sort_order'),
      sbFetch('dishes?select=*&order=id&limit=2000')
    ]);
    CATS = await cRes.json();
    var dishes = await dRes.json();
    var mcData = await mcRes.json();
    // 存储每个菜单的excludeCats
    MENU_CONFIGS = {};
    mcData.forEach(function(mc) {
      MENU_CONFIGS[mc.menu_id] = {
        excludeCats: mc.exclude_cats || [],
        menuLimit: mc.menu_limit || 0
      };
    });
    var [dm1Res, dm2Res, dm3Res] = await Promise.all([
      sbFetch('dish_menus?restaurant_id=eq.' + RESTAURANT_ID + '&select=*&limit=1000&offset=0'),
      sbFetch('dish_menus?restaurant_id=eq.' + RESTAURANT_ID + '&select=*&limit=1000&offset=1000'),
      sbFetch('dish_menus?restaurant_id=eq.' + RESTAURANT_ID + '&select=*&limit=1000&offset=2000')
    ]);
    DISH_MENUS = (await dm1Res.json()).concat(await dm2Res.json()).concat(await dm3Res.json());
    ALL_ITEMS = dishes.map(function(d) {
      var menus = {};
      DISH_MENUS.filter(function(dm){ return Number(dm.dish_id) === Number(d.id); })
        .forEach(function(dm) {
          menus[dm.menu_id] = { on: dm.enabled, price: parseFloat(dm.price)||0, max_qty: parseInt(dm.max_qty)||0, sconto: parseInt(dm.sconto)||0 };
        });
      return { id: d.id, category: d.category_id, name: d.name, desc: d.description||'', image: d.image||'', tags: d.tags||[], sold_out: d.sold_out||false, menus: menus };
    });
    if (currentMenuId) openMenuView(currentMenuId);
  } catch(e) { console.log('reload failed:', e); }
}

var CONFIG = {
  ADMIN_PIN: "8888",
  LOGO_CLICKS: 5,
  CLICK_TIMEOUT: 3000,
  WA_NUMBER: "393391406020",
  LUNCH_START: 11*60, LUNCH_KITCHEN_CLOSE: 15*60, LUNCH_END: 16*60,
  DINNER_START: 17*60, DINNER_KITCHEN_CLOSE: 23*60, DINNER_END: 23*60+59,
  TIMER_WARNING_MINS: 25
};
var isAdmin = false;
var logoClickCount = 0;
var logoClickTimer = null;
var pinValue = "";

function getRomeMinutes() {
  var str = new Date().toLocaleString("en-GB", {timeZone:"Europe/Rome"});
  var parts = str.split(", ")[1].split(":");
  return parseInt(parts[0])*60 + parseInt(parts[1]);
}
function setStatus(text, cls) {
  var el = document.getElementById("status");
  el.textContent = text;
  el.className = "status " + (cls||"");
}
function showMenuButtons(ids) {
  ["btnBevande","btnPranzo","btnCena","btnSpecial","btnDessert"].forEach(function(id) {
    document.getElementById(id).style.display = ids.indexOf(id) >= 0 ? "flex" : "none";
  });
}
function setTimerBanner(mins) {
  var banner = document.getElementById("timerBanner");
  if (mins > 0) {
    document.getElementById("countdown").textContent = mins;
    banner.style.display = "block";
  } else {
    banner.style.display = "none";
  }
}
function loadMenu() {
  if (isAdmin) {
    showMenuButtons(["btnBevande","btnPranzo","btnCena","btnSpecial","btnDessert"]);
    setStatus("MODALITÀ ADMIN · MENU SBLOCCATO","admin");
    setTimerBanner(0);
    return;
  }
  if (!SETTINGS.is_open) {
    showMenuButtons([]);
    setStatus("CHIUSO · RIAPRIAMO PRESTO","closed");
    return;
  }
  var t = getRomeMinutes();
  var C = CONFIG;
  setTimerBanner(0);
  if (t >= C.LUNCH_START && t < C.LUNCH_END) {
    var rem = C.LUNCH_KITCHEN_CLOSE - t;
    if (rem > 5) {
      showMenuButtons(["btnBevande","btnPranzo","btnDessert"]);
      setStatus("PRANZO EXPERIENCE");
      if (rem <= C.TIMER_WARNING_MINS) setTimerBanner(rem - 5);
    } else if (t < C.LUNCH_KITCHEN_CLOSE) {
      showMenuButtons(["btnBevande","btnDessert"]);
      setStatus("CUCINA IN CHIUSURA · ORDINI TERMINATI","closing");
    } else {
      showMenuButtons(["btnBevande","btnDessert"]);
      setStatus("CUCINA CHIUSA · SOLO BEVANDE E DESSERT");
    }
    return;
  }
  if (t >= C.DINNER_START && t < C.DINNER_END) {
    var rem = C.DINNER_KITCHEN_CLOSE - t;
    if (rem > 5) {
      showMenuButtons(["btnBevande","btnCena","btnSpecial","btnDessert"]);
      setStatus("CENA EXPERIENCE");
      if (rem <= C.TIMER_WARNING_MINS) setTimerBanner(rem - 5);
    } else if (t < C.DINNER_KITCHEN_CLOSE) {
      showMenuButtons(["btnBevande","btnDessert"]);
      setStatus("CUCINA IN CHIUSURA · ORDINI TERMINATI","closing");
    } else {
      showMenuButtons(["btnBevande","btnDessert"]);
      setStatus("CUCINA CHIUSA · SOLO BEVANDE E DESSERT");
    }
    return;
  }
  showMenuButtons([]);
  setStatus("CHIUSO · RIAPRIAMO PRESTO","closed");
}

function openMenuView(menuId) {
  currentMenuId = menuId;
  isAsporto = menuId === 'asporto';
  // 购物车永远不在切换菜单时清空，只有"清空"按钮才清空
  // 方案A：加历史记录，支持手机返回手势
  history.pushState({ menuId: menuId }, '', '#menu-' + menuId);

  var cfg = MENU_CONFIG[menuId] || {label: menuId, emoji: '🍽️', color: '#c8a84c'};

  // 设置徽章
  var badge = document.getElementById('menu-badge');
  badge.textContent = cfg.emoji + ' ' + cfg.label.toUpperCase();
  badge.style.background = cfg.color;

  // 设置信息行
  var info = document.getElementById('menu-info');
  var announcement = (SETTINGS && SETTINGS.announcement) ? SETTINGS.announcement : '🍱 Pranzo feriale: €16 · Festivo: €20 · Cena: €28 · Coperto: €2';
  info.innerHTML = '<span style="color:rgba(212,171,72,.8);font-size:11px;letter-spacing:.5px;">' + announcement + '</span>';

  // 过滤当前菜单的菜品（两级过滤）
  var excludeCats = (MENU_CONFIGS[menuId] && MENU_CONFIGS[menuId].excludeCats) || [];
  var items = ALL_ITEMS.filter(function(it) {
    // 第一级：分类是否被排除
    if (excludeCats.indexOf(it.category) >= 0) return false;
    // 第二级：菜品是否在此菜单启用
    var m = it.menus[menuId];
    return m && m.on;
  }).map(function(it) {
    var m = it.menus[menuId];
    return Object.assign({}, it, { price: m.price, max_qty: m.max_qty, sconto: m.sconto });
  });

  // 渲染菜品
  renderMenuItems(items);

  // 更新购物车按钮显示
  updateCartUI();

  // 切换视图
  document.getElementById('home-view').style.display = 'none';
  document.getElementById('menu-view').style.display = 'block';
  window.scrollTo(0, 0);
}

function closeMenuView() {
  currentMenuId = null;
  // 不清空购物车，保留跨菜单的选择
  document.getElementById('menu-view').style.display = 'none';
  document.getElementById('home-view').style.display = 'flex';
  closeCart();
  // 清除hash
  if (window.location.hash) {
    history.replaceState(null, '', window.location.pathname);
  }
}

// 菜品渲染
// ════════════════════════════════════
var scrollLock = false, scrollLockTimer = null;
var obs = null;

function renderMenuItems(items) {
  var nav = document.getElementById('catnav-inner');
  var main = document.getElementById('menu-main');
  nav.innerHTML = '';
  main.innerHTML = '';

  // 建立分类组
  var groups = {};
  items.forEach(function(it) {
    if (!groups[it.category]) groups[it.category] = [];
    groups[it.category].push(it);
  });

  var firstCat = true;
  CATS.forEach(function(cat) {
    if (!groups[cat.id] || !groups[cat.id].length) return;

    // 导航按钮
    var btn = document.createElement('button');
    btn.className = 'cbtn' + (firstCat ? ' active' : '');
    btn.setAttribute('data-id', cat.id);
    btn.innerHTML = '<span>' + cat.icon + '</span><span>' + cat.name + '</span>';
    btn.onclick = function() {
      scrollLock = true;
      clearTimeout(scrollLockTimer);
      document.querySelectorAll('.cbtn').forEach(function(b) {
        b.className = 'cbtn' + (b.getAttribute('data-id') === cat.id ? ' active' : '');
      });
      var sec = document.getElementById('sec-' + cat.id);
      if (sec) sec.scrollIntoView({behavior:'smooth', block:'start'});
      scrollLockTimer = setTimeout(function(){ scrollLock = false; }, 1000);
      // 手动滚动分类导航，不用scrollIntoView避免页面横向偏移
      var navEl = document.getElementById('catnav-inner');
      var activeBtn = navEl ? navEl.querySelector('.cbtn.active') : null;
      if (activeBtn && navEl && navEl.parentNode) {
        var nav = navEl.parentNode;
        nav.scrollLeft = activeBtn.offsetLeft - nav.offsetWidth/2 + activeBtn.offsetWidth/2;
      }
    };
    nav.appendChild(btn);
    firstCat = false;

    // 分类区块
    var sec = document.createElement('section');
    sec.id = 'sec-' + cat.id;
    var hd = document.createElement('div');
    hd.className = 'shead';
    hd.innerHTML = '<h2>' + cat.icon + ' ' + cat.name + '</h2><div class="sline"></div>' +
      '<span class="scnt">' + groups[cat.id].length + ' piatt' + (groups[cat.id].length === 1 ? 'o' : 'i') + '</span>';
    sec.appendChild(hd);
    var grid = document.createElement('div');
    grid.className = 'grid';
    groups[cat.id].forEach(function(it, gi) {
      grid.appendChild(mkCard(it, gi));
    });
    sec.appendChild(grid);
    main.appendChild(sec);
  });

  if (!main.children.length) {
    main.innerHTML = '<div class="nores"><div style="font-size:40px;margin-bottom:12px">🔍</div><h3>Nessun piatto disponibile</h3></div>';
    return;
  }

  // 刷新数量显示
  items.forEach(function(it) { updateItemUI(it.id); });

  // 滚动监听
  if (obs) obs.disconnect();
  obs = new IntersectionObserver(function(entries) {
    if (scrollLock) return;
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var cid = entry.target.id.replace('sec-', '');
        document.querySelectorAll('.cbtn').forEach(function(b) {
          var active = b.getAttribute('data-id') === cid;
          b.className = 'cbtn' + (active ? ' active' : '');
          if (active) {
            var nav = b.parentNode ? b.parentNode.parentNode : null;
            if (nav) nav.scrollLeft = b.offsetLeft - nav.offsetWidth/2 + b.offsetWidth/2;
          }
        });
      }
    });
  }, {rootMargin: '-25% 0px -65% 0px'});
  setTimeout(function() {
    document.querySelectorAll('section[id^="sec-"]').forEach(function(s) { obs.observe(s); });
  }, 100);
}

function mkCard(it, delay) {
  var cat = CATS.find(function(c){ return c.id === it.category; });
  var icon = cat ? cat.icon : '🍽️';
  var card = document.createElement('div');
  card.className = 'card' + (it.sold_out ? ' so' : '');
  card.style.animationDelay = (delay * 0.04) + 's';

  var iw = null;
  if (it.image) {
    iw = document.createElement('div');
    iw.className = 'cimg';
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = it.name;
    img.setAttribute('data-fb', icon);
    img.onerror = function() {
      // 图片加载失败时移除整个图片区域
      if (this.parentNode && this.parentNode.parentNode) {
        this.parentNode.parentNode.removeChild(this.parentNode);
      }
    };
    img.src = it.image;
    iw.appendChild(img);
  }
  // 没有图片路径时不显示图片区域
  if (it.sold_out) {
    var sb = document.createElement('div');
    sb.className = 'sbadge';
    sb.textContent = 'Esaurito';
    iw.appendChild(sb);
  }
  if (it.sconto > 0) {
    var scb = document.createElement('div');
    scb.className = 'scbadge';
    scb.textContent = '-' + it.sconto + '%';
    iw.appendChild(scb);
  }
  if (it.max_qty > 0) {
    var mb = document.createElement('div');
    mb.className = 'mqbadge';
    mb.textContent = 'max ' + it.max_qty;
    iw.appendChild(mb);
  }

  var body = document.createElement('div');
  body.className = 'cbody';
  var te = document.createElement('div');
  te.className = 'ctags';
  (it.tags || []).forEach(function(t) {
    var td = TAGS[t];
    if (!td) return;
    var sp = document.createElement('span');
    sp.className = 'tag';
    sp.style.color = td.color;
    sp.style.borderColor = td.color;
    sp.textContent = td.icon + ' ' + td.label;
    te.appendChild(sp);
  });
  if (te.children.length) body.appendChild(te);

  var nm = document.createElement('div');
  nm.className = 'cname';
  nm.textContent = it.name;
  body.appendChild(nm);

  if (it.desc) {
    var dc = document.createElement('div');
    dc.className = 'cdesc';
    dc.textContent = it.desc;
    body.appendChild(dc);
  }

  var ft = document.createElement('div');
  ft.className = 'cfoot';
  var prdiv = document.createElement('div');
  prdiv.className = 'cprice';
  var dispPrice = it.sconto > 0 ? it.price * (1 - it.sconto/100) : it.price;
  if (dispPrice > 0) {
    var sym = document.createElement('span');
    sym.className = 'sym';
    sym.textContent = '€';
    prdiv.appendChild(sym);
    prdiv.appendChild(document.createTextNode(' ' + Number(dispPrice).toFixed(2).replace('.', ',')));
    if (it.sconto > 0) {
      var orig = document.createElement('span');
      orig.style.cssText = 'font-size:10px;color:var(--muted2);text-decoration:line-through;margin-left:4px;';
      orig.textContent = Number(it.price).toFixed(2).replace('.', ',');
      prdiv.appendChild(orig);
    }
  }
  ft.appendChild(prdiv);
  var ac = document.createElement('div');
  ac.id = 'ac' + it.id;
  ft.appendChild(ac);

  body.appendChild(ft);
  if (iw) card.appendChild(iw);
  card.appendChild(body);
  return card;
}

// ════════════════════════════════════
// 购物车逻辑
// ════════════════════════════════════
function getItemForMenu(id) {
  var it = ALL_ITEMS.find(function(x){ return x.id == id; });
  if (!it || !currentMenuId) return null;
  var m = it.menus[currentMenuId];
  if (!m) return null;
  return Object.assign({}, it, {price: m.price, max_qty: m.max_qty, sconto: m.sconto});
}

function toast(msg, duration) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'show';
  clearTimeout(toast._t);
  toast._t = setTimeout(function() { el.className = ''; }, duration || 2500);
}

function cartCount() {
  var n = 0;
  for (var k in cart) n += cart[k];
  return n;
}

function cartTotal() {
  var t = 0;
  for (var id in cart) {
    var it = getItemForMenu(id);
    if (it) {
      var p = it.sconto > 0 ? it.price * (1 - it.sconto/100) : it.price;
      t += p * cart[id];
    }
  }
  return t;
}

function fmt(n) { return '€ ' + Number(n).toFixed(2).replace('.', ','); }

function addItem(it) {
  console.log('[addItem] id:', it.id, 'price:', it.price, 'cart:', JSON.stringify(cart), 'menuId:', currentMenuId);
  var mq = it.max_qty || 0;
  var cur = cart[it.id] || 0;

  // 检查单品最大数量
  if (mq > 0 && cur >= mq) {
    toast('⚠️ Quantità massima per questo piatto raggiunta');
    return;
  }

  // 价格>0的菜不受任何限制
  // it.price已经是当前菜单的price（由openMenuView的Object.assign设置）
  var hasPrice = (parseFloat(it.price) || 0) > 0;

  if (!hasPrice) {
    // 检查轮次限制
    var roundCheck = canAddItem();
    if (!roundCheck.ok) {
      toast('⚠️ ' + roundCheck.msg);
      return;
    }

    // 检查菜单级别限制（只计算price=0的菜，用当前菜单的价格判断）
    if (currentMenuId) {
      var menuLimit = (MENU_CONFIGS[currentMenuId] && MENU_CONFIGS[currentMenuId].menuLimit) || 0;
      if (menuLimit > 0) {
        var menuTotal = 0;
        for (var k in cart) {
          var kit = getItemById(k);
          if (kit && kit.menus && kit.menus[currentMenuId] && kit.menus[currentMenuId].on) {
            var kitPrice = parseFloat(kit.menus[currentMenuId].price) || 0;
            if (kitPrice === 0) menuTotal += cart[k];
          }
        }
        if (menuTotal + 1 > menuLimit * guestCount) {
          toast('⚠️ Limite menu: max ' + (menuLimit * guestCount) + ' piatti (' + menuLimit + '/persona x ' + guestCount + (guestCount===1?' persona':' persone') + ')');
          return;
        }
      }
    }

    // 检查分类级别限制（只计算price=0的菜）
    var catLimit = getCatLimit(it.category);
    if (catLimit > 0) {
      var catTotal = 0;
      for (var k2 in cart) {
        var kit2 = getItemById(k2);
        if (kit2 && kit2.category === it.category && !(kit2.price > 0)) {
          catTotal += cart[k2];
        }
      }
      if (catTotal + 1 > catLimit * guestCount) {
        toast('⚠️ Limite categoria ' + getCatName(it.category) + ': max ' + (catLimit * guestCount) + ' piatti (' + catLimit + '/persona x ' + guestCount + (guestCount===1?' persona':' persone') + ')');
        return;
      }
    }
  }

  cart[it.id] = cur + 1;
  updateItemUI(it.id);
  updateCartUI();
}

// DEBUG - 临时调试函数
function debugAddItem(it) {
  console.log('[DEBUG] addItem id:', it.id, 'price:', it.price, 'cart before:', JSON.stringify(cart));
  var menuLimit = (MENU_CONFIGS[currentMenuId] && MENU_CONFIGS[currentMenuId].menuLimit) || 0;
  var menuTotal = 0;
  for (var k in cart) {
    var kit = getItemById(k);
    if (kit && kit.menus && kit.menus[currentMenuId] && kit.menus[currentMenuId].on) {
      var kitPrice = parseFloat(kit.menus[currentMenuId].price) || 0;
      if (kitPrice === 0) menuTotal += cart[k];
    }
  }
  console.log('[DEBUG] menuLimit:', menuLimit, 'menuTotal:', menuTotal, 'would block:', menuTotal + 1 > menuLimit * guestCount);
}

function getItemById(id) {
  for (var i = 0; i < ALL_ITEMS.length; i++) {
    if (String(ALL_ITEMS[i].id) === String(id)) return ALL_ITEMS[i];
  }
  return null;
}

function getCatLimit(catId) {
  for (var i = 0; i < CATS.length; i++) {
    if (CATS[i].id === catId) return parseInt(CATS[i].cat_limit) || 0;
  }
  return 0;
}

function getCatName(catId) {
  for (var i = 0; i < CATS.length; i++) {
    if (CATS[i].id === catId) return CATS[i].name;
  }
  return catId;
}

function changeQty(it, d) {
  var mq = it.max_qty || 0;
  var nv = Math.max(0, (cart[it.id] || 0) + d);
  if (d > 0 && mq > 0 && nv > mq) nv = mq;
  cart[it.id] = nv;
  if (cart[it.id] === 0) delete cart[it.id];
  updateItemUI(it.id);
  updateCartUI();
}

function updateItemUI(itemId) {
  var el = document.getElementById('ac' + itemId);
  if (!el) return;
  var it = getItemForMenu(itemId);
  if (!it) return;
  var q = cart[itemId] || 0;
  el.innerHTML = '';
  if (q === 0) {
    var btn = document.createElement('button');
    btn.className = 'add-btn';
    btn.textContent = '+';
    (function(i){ btn.onclick = function(){ addItem(i); }; })(it);
    el.appendChild(btn);
  } else {
    var div = document.createElement('div');
    div.className = 'qctrl';
    var bm = document.createElement('button');
    bm.className = 'qbtn';
    bm.textContent = '−';
    var sp = document.createElement('span');
    sp.className = 'qnum';
    sp.textContent = q;
    var bp = document.createElement('button');
    bp.className = 'qbtn';
    bp.textContent = '+';
    (function(i){ bm.onclick = function(){ changeQty(i,-1); }; bp.onclick = function(){ changeQty(i,+1); }; })(it);
    div.appendChild(bm);
    div.appendChild(sp);
    div.appendChild(bp);
    el.appendChild(div);
  }
}

function updateCartUI() {
  var n = cartCount();
  var badge = document.getElementById('cart-badge');
  if (badge) { badge.textContent = n; badge.className = 'cbadge' + (n > 0 ? ' on' : ''); }
  var tot = document.getElementById('cart-total');
  if (tot) tot.textContent = fmt(cartTotal());
  updateCartButtons();
  renderCartBody();
}

function updateCartButtons() {
  var n = cartCount();
  var tableNum = document.getElementById('table-number');
  var tVal = tableNum ? tableNum.value.trim() : '';

  // 外卖：显示发送按钮，隐藏叫服务员
  var btnOrder = document.getElementById('btn-order');
  var btnNotify = document.getElementById('btn-notify');
  var tableWrap = document.getElementById('table-input-wrap');

  var nameWrap = document.getElementById('asporto-name-wrap');
  var timeWrap = document.getElementById('asporto-time-wrap');
  var asportoName = document.getElementById('asporto-name');
  var asportoTime = document.getElementById('asporto-time');

  if (isAsporto) {
    // 外卖：显示姓名+时间，隐藏桌号+堂食备注
    if (tableWrap) tableWrap.style.display = 'none';
    var noteWrap2 = document.getElementById('note-wrap');
    if (noteWrap2) noteWrap2.style.display = 'none';
    var guestWrap2 = document.getElementById('guest-wrap');
    if (guestWrap2) guestWrap2.style.display = 'none';
    if (nameWrap) nameWrap.style.display = 'block';
    if (timeWrap) timeWrap.style.display = 'block';
    btnNotify.style.display = 'none';

    // 填充时间选项（如果还没填充）
    if (asportoTime && asportoTime.options.length <= 1) {
      var slots = [];
      // 午餐 12:00 - 15:00
      for (var h = 12; h <= 15; h++) {
        for (var m = 0; m < 60; m += 30) {
          if (h === 15 && m > 0) break;
          slots.push((h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m);
        }
      }
      // 分隔线
      var sep = document.createElement('option');
      sep.disabled = true;
      sep.textContent = '── Cena ──';
      asportoTime.appendChild(document.createElement('option')).textContent = '── Pranzo sopra · Cena sotto ──';
      asportoTime.options[asportoTime.options.length-1].disabled = true;
      // 晚餐 19:00 - 23:00
      for (var h = 19; h <= 23; h++) {
        for (var m = 0; m < 60; m += 30) {
          if (h === 23 && m > 0) break;
          slots.push((h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m);
        }
      }
      // 先清空再填充
      asportoTime.innerHTML = '<option value="">Seleziona orario...</option>';
      var lunchAdded = false, dinnerAdded = false;
      slots.forEach(function(t) {
        if (!lunchAdded && t >= '12:00' && t <= '15:00') {
          if (t === '12:00') {
            var g = document.createElement('option');
            g.disabled = true; g.textContent = '─── Pranzo ───';
            asportoTime.appendChild(g);
          }
          lunchAdded = true;
        }
        if (!dinnerAdded && t >= '19:00') {
          var g = document.createElement('option');
          g.disabled = true; g.textContent = '─── Cena ───';
          asportoTime.appendChild(g);
          dinnerAdded = true;
        }
        var op = document.createElement('option');
        op.value = t; op.textContent = t;
        asportoTime.appendChild(op);
      });
    }

    // 显示外卖备注框
    var asportoNoteWrap = document.getElementById('asporto-note-wrap');
    if (asportoNoteWrap) asportoNoteWrap.style.display = 'block';
    if (SETTINGS.takeaway_enabled) {
      var nameVal = asportoName ? asportoName.value.trim() : '';
      var timeVal = asportoTime ? asportoTime.value : '';
      btnOrder.style.display = 'block';
      btnOrder.disabled = (!nameVal || !timeVal);
    } else {
      btnOrder.style.display = 'none';
    }
  } else {
    // 堂食：显示桌号+备注，隐藏姓名+时间+外卖备注
    btnOrder.style.display = 'none';
    if (nameWrap) nameWrap.style.display = 'none';
    if (timeWrap) timeWrap.style.display = 'none';
    if (tableWrap) tableWrap.style.display = 'block';
    var noteWrap = document.getElementById('note-wrap');
    if (noteWrap) noteWrap.style.display = 'block';
    var guestWrap = document.getElementById('guest-wrap');
    if (guestWrap) guestWrap.style.display = 'block';
    var guestDisplay = document.getElementById('guest-display');
    if (guestDisplay) guestDisplay.textContent = guestCount;
    // 加载桌号session和轮次信息
    var roundMax = SETTINGS.round_max || 0;
    var roundTotal = SETTINGS.round_total || 0;
    var roundInfoEl = document.getElementById('round-info');
    var resetWrap = document.getElementById('reset-round-wrap');
    if (roundMax > 0 || roundTotal > 0) {
      if (roundInfoEl) roundInfoEl.style.display = 'block';
      if (resetWrap) resetWrap.style.display = 'block';
      if (tVal) loadTableSession(tVal);
      else updateRoundUI();
    } else {
      if (roundInfoEl) roundInfoEl.style.display = 'none';
      if (resetWrap) resetWrap.style.display = 'none';
    }
    var asportoNoteWrap2 = document.getElementById('asporto-note-wrap');
    if (asportoNoteWrap2) asportoNoteWrap2.style.display = 'none';
    if (SETTINGS.notify_enabled) {
      btnNotify.style.display = 'block';
      btnNotify.disabled = !tVal;
    } else {
      btnNotify.style.display = 'none';
    }
  }
}

function renderCartBody() {
  var el = document.getElementById('cart-body');
  if (!el) return;
  var n = cartCount();
  if (!n) {
    el.innerHTML = '<div class="cempty"><div style="font-size:48px;margin-bottom:12px">🌱</div><p>Il carrello è vuoto</p></div>';
    return;
  }
  el.innerHTML = '';
  for (var id in cart) {
    (function(id, qty) {
      var it = getItemForMenu(id);
      if (!it) return;
      var cat = CATS.find(function(c){ return c.id === it.category; });
      var icon = cat ? cat.icon : '🍽️';
      var row = document.createElement('div');
      row.className = 'ci';
      var th = document.createElement('div');
      th.className = 'ci-th';
      if (it.image) {
        var im = document.createElement('img');
        im.src = it.image;
        im.setAttribute('data-fb', icon);
        im.onerror = function(){ this.parentNode.textContent = this.getAttribute('data-fb'); };
        th.appendChild(im);
      } else th.textContent = icon;
      var info = document.createElement('div');
      info.className = 'ci-info';
      var p = it.sconto > 0 ? it.price * (1 - it.sconto/100) : it.price;
      info.innerHTML = '<div class="ci-name">' + it.name + '</div>' +
        '<div class="ci-price">' + fmt(p) + ' × ' + qty + ' = ' + fmt(p * qty) + '</div>';
      var qc = document.createElement('div');
      qc.className = 'ci-qty';
      var bm = document.createElement('button'); bm.className = 'qbtn'; bm.textContent = '−';
      var sp = document.createElement('span'); sp.className = 'qnum'; sp.textContent = qty;
      var bp = document.createElement('button'); bp.className = 'qbtn'; bp.textContent = '+';
      (function(i){ bm.onclick = function(){ changeQty(i,-1); }; bp.onclick = function(){ changeQty(i,+1); }; })(it);
      qc.appendChild(bm); qc.appendChild(sp); qc.appendChild(bp);
      row.appendChild(th); row.appendChild(info); row.appendChild(qc);
      el.appendChild(row);
    })(id, cart[id]);
  }
  // 更新合计
  var tot = document.getElementById('cart-total');
  if (tot) tot.textContent = fmt(cartTotal());

  // 更新信息
  var info = document.getElementById('cart-info');
  if (info) {
    info.innerHTML = '<strong>' + R.name + '</strong><br>📞 ' + (R.phone||'') + '<br>' + (R.address||'');
  }
}

// 叫服务员
// ════════════════════════════════════
//  轮次控制
// ════════════════════════════════════

async function loadTableSession(tableNum) {
  if (!tableNum) { _tableSession = null; _roundCartCount = 0; return; }
  try {
    var res = await sbFetch('table_sessions?restaurant_id=eq.' + RESTAURANT_ID + '&table_number=eq.' + encodeURIComponent(tableNum) + '&select=*');
    var data = await res.json();
    if (data && data[0]) {
      var s = data[0];
      // 检查是否超过4小时自动重置
      var created = new Date(s.created_at);
      var now = new Date();
      if ((now - created) > 4 * 60 * 60 * 1000) {
        await resetTableSession(tableNum);
        return;
      }
      _tableSession = s;
    } else {
      _tableSession = null;
    }
    updateRoundUI();
  } catch(e) { console.log('loadTableSession error:', e); }
}

async function resetTableSession(tableNum) {
  if (!tableNum) return;
  try {
    // 删除旧记录
    await sbFetch('table_sessions?restaurant_id=eq.' + RESTAURANT_ID + '&table_number=eq.' + encodeURIComponent(tableNum), {method: 'DELETE'});
    _tableSession = null;
    _roundCartCount = 0;
    updateRoundUI();
    toast('✅ Tavolo ' + tableNum + ' resettato');
  } catch(e) { toast('❌ Errore reset: ' + e.message); }
}

async function recordRoundSent(tableNum) {
  if (!tableNum) return;
  var roundMax = SETTINGS.round_max || 0;
  var roundTotal = SETTINGS.round_total || 0;
  if (roundMax === 0 && roundTotal === 0) return; // 未启用轮次控制
  try {
    var now = new Date().toISOString();
    if (_tableSession) {
      var newRound = (_tableSession.round_number || 1) + 1;
      await sbFetch('table_sessions?restaurant_id=eq.' + RESTAURANT_ID + '&table_number=eq.' + encodeURIComponent(tableNum), {
        method: 'PATCH',
        body: JSON.stringify({round_number: newRound, last_sent_at: now})
      });
      _tableSession.round_number = newRound;
      _tableSession.last_sent_at = now;
    } else {
      await sbFetch('table_sessions', {
        method: 'POST',
        body: JSON.stringify({restaurant_id: RESTAURANT_ID, table_number: tableNum, round_number: 1, last_sent_at: now})
      });
      _tableSession = {round_number: 1, last_sent_at: now};
    }
    _roundCartCount = 0;
    updateRoundUI();
  } catch(e) { console.log('recordRoundSent error:', e); }
}

function getRoundStatus() {
  var roundMax = SETTINGS.round_max || 0;
  var roundTotal = SETTINGS.round_total || 0;
  var roundInterval = SETTINGS.round_interval || 0;
  if (roundMax === 0 && roundTotal === 0) return {ok: true}; // 未启用

  var currentRound = _tableSession ? (_tableSession.round_number || 1) : 1;
  var lastSent = _tableSession ? _tableSession.last_sent_at : null;

  // 检查是否超过总轮数
  if (roundTotal > 0 && currentRound > roundTotal) {
    return {ok: false, msg: 'Hai completato tutti i ' + roundTotal + ' turni'};
  }

  // 检查间隔时间
  if (lastSent && roundInterval > 0) {
    var elapsed = (new Date() - new Date(lastSent)) / 60000; // 分uti
    if (elapsed < roundInterval) {
      var remaining = Math.ceil(roundInterval - elapsed);
      return {ok: false, msg: 'Prossimo turno tra ' + remaining + ' minut' + (remaining===1?'o':'i'), countdown: remaining};
    }
  }

  return {ok: true, round: currentRound, roundTotal: roundTotal, roundMax: roundMax};
}

function updateRoundUI() {
  var status = getRoundStatus();
  var roundMax = SETTINGS.round_max || 0;
  var roundTotal = SETTINGS.round_total || 0;
  if (roundMax === 0 && roundTotal === 0) return;

  var roundInfoEl = document.getElementById('round-info');
  if (!roundInfoEl) return;

  var currentRound = _tableSession ? (_tableSession.round_number || 1) : 1;

  if (!status.ok) {
    roundInfoEl.innerHTML = '<div style="color:#e74c3c;font-size:12px;text-align:center;padding:8px;">⏳ ' + status.msg + '</div>';
  } else {
    var roundText = roundTotal > 0 ? 'Turno ' + currentRound + '/' + roundTotal : 'Turno ' + currentRound;
    var maxText = roundMax > 0 ? ' · max ' + (roundMax * guestCount) + ' piatti' : '';
    roundInfoEl.innerHTML = '<div style="color:var(--gold);font-size:11px;text-align:center;padding:6px;">🍽️ ' + roundText + maxText + '</div>';
  }
}

function canAddItem() {
  var roundMax = SETTINGS.round_max || 0;
  if (roundMax === 0) return {ok: true};
  var status = getRoundStatus();
  if (!status.ok) return {ok: false, msg: status.msg};
  // 只计算price=0的菜（用该菜在其对应菜单里的price判断）
  var thisRoundCount = 0;
  for (var k in cart) {
    var kit = getItemById(k);
    if (kit) {
      // 检查该菜在任意菜单里的price是否>0
      var kitHasPrice = false;
      if (kit.menus) {
        for (var mid in kit.menus) {
          if ((parseFloat(kit.menus[mid].price) || 0) > 0) { kitHasPrice = true; break; }
        }
      }
      if (!kitHasPrice) thisRoundCount += cart[k];
    }
  }
  if (thisRoundCount >= roundMax * guestCount) {
    return {ok: false, msg: 'Limite turno: max ' + (roundMax * guestCount) + ' piatti per questo turno'};
  }
  return {ok: true};
}

// 修改人数（需要服务员密码）
function changeGuestCount() {
  var pwd = prompt('Inserisci il codice cameriere:');
  if (pwd === null) return;
  if (pwd !== WAITER_PASSWORD) {
    alert('Codice non corretto.');
    return;
  }
  var n = prompt('Numero di persone (1-20):', guestCount);
  if (n === null) return;
  n = parseInt(n);
  if (isNaN(n) || n < 1 || n > 20) {
    alert('Numero non valido (1-20).');
    return;
  }
  guestCount = n;
  var guestDisplay = document.getElementById('guest-display');
  if (guestDisplay) guestDisplay.textContent = guestCount;
  updateCartUI();
  toast('👥 ' + guestCount + ' ' + (guestCount === 1 ? 'persona' : 'persone'));
}

function confirmResetRound() {
  var pwd = prompt('Codice cameriere per reset:');
  if (pwd === null) return;
  if (pwd !== WAITER_PASSWORD) { alert('Codice non corretto.'); return; }
  var tableNum = document.getElementById('table-number') ? document.getElementById('table-number').value.trim() : '';

}

function sendNotify() {

  if (!tableNum) { alert('Inserisci il numero del tavolo.'); return; }
  var note = (document.getElementById('order-note') || {}).value || '';
  note = note.trim();
  var lines = ['🔔 *CHIAMATA CAMERIERE - Yio Fish Carpi*', '', '🪑 Tavolo: ' + tableNum, ''];
  for (var id in cart) {
    var it = getItemForMenu(id);
    if (it) lines.push('• ' + it.name + ' x' + cart[id]);
  }
  if (cartTotal() > 0) { lines.push(''); lines.push('💵 Totale: ' + fmt(cartTotal())); }
  if (note) { lines.push(''); lines.push('📝 Note: ' + note); }
  window.open('https://wa.me/' + CONFIG.WA_NUMBER + '?text=' + encodeURIComponent(lines.join('\n')), '_blank');
}

// 外卖发送
function sendOrder() {
  var nameEl = document.getElementById('asporto-name');
  var timeEl = document.getElementById('asporto-time');
  var nome = nameEl ? nameEl.value.trim() : '';
  var orario = timeEl ? timeEl.value : '';

  if (!orario) { alert("Seleziona l'orario di ritiro."); return; }
  var note = (document.getElementById('asporto-note') || {}).value || '';
  note = note.trim();
  var lines = ['📦 *ORDINE ASPORTO - Yio Fish Carpi*', '', '👤 Nome: ' + nome, '⏰ Ritiro: ' + orario, ''];
  for (var id in cart) {
    var it = getItemForMenu(id);
    if (it) lines.push('• ' + it.name + ' x' + cart[id] + (it.price > 0 ? ' (' + fmt(it.price * cart[id]) + ')' : ''));
  }
  if (cartTotal() > 0) { lines.push(''); lines.push('💵 Totale: ' + fmt(cartTotal())); }
  if (note) { lines.push(''); lines.push('📝 Note: ' + note); }
  window.open('https://wa.me/' + CONFIG.WA_NUMBER + '?text=' + encodeURIComponent(lines.join('\n')), '_blank');
}

  var q = this.value.trim().toLowerCase();
  var sx = document.getElementById('search-clear');
  if (sx) sx.className = 'srch-x' + (q ? ' on' : '');
  if (!currentMenuId) return;
  var items = ALL_ITEMS.filter(function(it) {
    var m = it.menus[currentMenuId];
    if (!m || !m.on) return false;
    if (!q) return true;
    return it.name.toLowerCase().indexOf(q) >= 0 || (it.desc||'').toLowerCase().indexOf(q) >= 0;
  }).map(function(it) {
    var m = it.menus[currentMenuId];
    return Object.assign({}, it, {price: m.price, max_qty: m.max_qty, sconto: m.sconto});
  });
  renderMenuItems(items);
});
