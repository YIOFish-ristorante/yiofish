<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YIO Fish</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YIO Fish">

<!-- 早期路由：DOM 渲染前秒跳缓存的 URL（同会话内手动选过店或自动跳过的） -->
<script>
(function () {
  try {
    var CACHE_KEY = 'yio_route_v1';
    var CACHE_NONE = '__select__';
    if (new URLSearchParams(location.search).has('manual')) {
      sessionStorage.removeItem(CACHE_KEY);
      return;
    }
    var cached = sessionStorage.getItem(CACHE_KEY);
    if (cached && cached !== CACHE_NONE) {
      location.replace(cached);
    }
  } catch (e) {}
})();
</script>

<style>
  :root {
    --gold: #bfa46f;
    --gold-dim: rgba(191,164,111,0.10);
    --bg: #000;
    --surface: #111;
    --border: #2a2a2a;
    --text: #fff;
    --text-muted: #555;
    --radius: 16px;
    --transition: 0.22s cubic-bezier(.4,0,.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .container {
    width: 92%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 20px;
    animation: fadeIn .35s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .logo-wrap { width: 150px; margin: 0 auto 28px; }
  .logo-wrap img { width: 100%; height: auto; display: block; filter: brightness(1.1); }
  .gold-line { width: 40px; height: 1px; background: var(--gold); margin: 0 auto 32px; opacity: .5; }
  .subtitle {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-muted);
    margin-bottom: 36px;
    min-height: 14px;
    transition: color var(--transition), opacity var(--transition);
  }
  .subtitle.detecting {
    color: var(--gold);
    animation: pulseSoft 1.6s ease-in-out infinite;
  }
  @keyframes pulseSoft {
    0%, 100% { opacity: .5; }
    50%      { opacity: .9; }
  }
  .location-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 22px 20px;
    margin-bottom: 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
    transition: border-color var(--transition), background var(--transition), transform var(--transition);
    -webkit-tap-highlight-color: transparent;
    gap: 6px;
  }
  .location-btn:active { background: var(--gold-dim); border-color: var(--gold); transform: scale(.97); }
  .loc-name { font-size: 15px; font-weight: 600; letter-spacing: 2.5px; color: var(--gold); }
  .loc-city { font-size: 11px; letter-spacing: 2px; color: var(--text-muted); }
  .footer { margin-top: 40px; font-size: 10px; color: #333; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <img src="logo.png" alt="YIO Fish">
  </div>
  <div class="gold-line"></div>
  <p class="subtitle" id="subtitle">SELEZIONA IL RISTORANTE</p>

  <a class="location-btn" href="carpi.html">
    <span class="loc-name">YIO Fish CARPI</span>
  </a>

  <a class="location-btn" href="legnago.html">
    <span class="loc-name">YIO Fish LEGNAGO</span>
  </a>

  <a class="location-btn" href="imola.html">
    <span class="loc-name">YIO Fish IMOLA</span>
  </a>

  <div class="footer">www.yiofish.it</div>
</div>

<script>
(async function () {
  // ============ 配置区 ============
  const STORES = [
    { lat: 44.7852782, lng: 10.8631876, url: 'carpi.html'   },
    { lat: 45.1852781, lng: 11.2624608, url: 'legnago.html' },
    { lat: 44.368134,  lng: 11.708871,  url: 'imola.html'   }
  ];
  const AUTO_OPEN_RADIUS_KM = 1.5;     // 1.5公里内自动打开
  const ACCURACY_LIMIT_M   = 2000;     // GPS 精度差于此值不信任
  const GEO_TIMEOUT        = 5000;
  const HARD_TIMEOUT       = 6000;
  const GEO_MAX_AGE        = 5 * 60 * 1000;
  const CACHE_KEY  = 'yio_route_v1';
  const CACHE_NONE = '__select__';

  const skipAuto = new URLSearchParams(location.search).has('manual');

  const ss = {
    get(k)    { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v);    } catch (e) {} },
    remove(k) { try { sessionStorage.removeItem(k);    } catch (e) {} }
  };

  function haversine(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  const subtitle = document.getElementById('subtitle');

  // 1. 客人手动点选 → 缓存这次会话的选择
  document.querySelectorAll('.location-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      ss.set(CACHE_KEY, btn.getAttribute('href'));
    }, { passive: true });
  });

  // 2. 入口决策
  if (skipAuto) { ss.remove(CACHE_KEY); return; }
  if (ss.get(CACHE_KEY) === CACHE_NONE) return;
  if (!('geolocation' in navigator)) return;

  // 3. ★ 关键：先查权限状态，绝不主动弹窗
  if (!('permissions' in navigator)) return;  // 老浏览器不支持 Permissions API → 选择页

  let permission;
  try {
    permission = await navigator.permissions.query({ name: 'geolocation' });
  } catch (e) {
    return;  // 不支持 query 'geolocation' → 选择页
  }

  if (permission.state !== 'granted') {
    return;  // 未授权（prompt / denied）→ 选择页，绝不弹窗
  }

  // 4. 已授权（granted）→ 静默获取位置（这一步不会弹窗）
  subtitle.textContent = 'RILEVAMENTO POSIZIONE...';
  subtitle.classList.add('detecting');

  let settled = false;
  function settle(fn) {
    if (settled) return;
    settled = true;
    clearTimeout(hardTimer);
    try { fn(); } catch (e) { resetSubtitle(); }
  }

  const hardTimer = setTimeout(() => settle(resetSubtitle), HARD_TIMEOUT);

  try {
    navigator.geolocation.getCurrentPosition(
      (pos) => settle(() => handlePosition(pos)),
      ()    => settle(resetSubtitle),
      { enableHighAccuracy: false, timeout: GEO_TIMEOUT, maximumAge: GEO_MAX_AGE }
    );
  } catch (e) {
    settle(resetSubtitle);
  }

  function handlePosition(pos) {
    const { latitude, longitude, accuracy } = pos.coords;

    // GPS 精度太差（如 iOS 关闭精确定位 → 3000-9000m）→ 不可靠
    if (accuracy > ACCURACY_LIMIT_M) {
      ss.set(CACHE_KEY, CACHE_NONE);
      resetSubtitle();
      return;
    }

    let nearest = null, minDist = Infinity;
    for (const s of STORES) {
      const d = haversine(latitude, longitude, s.lat, s.lng);
      if (d < minDist) { minDist = d; nearest = s; }
    }

    if (nearest && minDist <= AUTO_OPEN_RADIUS_KM) {
      ss.set(CACHE_KEY, nearest.url);
      subtitle.textContent = 'APERTURA MENU...';
      location.replace(nearest.url);
    } else {
      ss.set(CACHE_KEY, CACHE_NONE);
      resetSubtitle();
    }
  }

  function resetSubtitle() {
    subtitle.textContent = 'SELEZIONA IL RISTORANTE';
    subtitle.classList.remove('detecting');
  }
})();
</script>
</body>
</html>
