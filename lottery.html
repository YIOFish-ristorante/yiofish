<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YIO Fish · Lotteria</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070d0a;--card:#0d1611;--gold:#c9a962;--gold-lt:#e8d5a3;--gold-dk:#8a7238;
  --text:#f0ead9;--muted:rgba(240,234,217,.55);--line:rgba(201,169,98,.3);
  --green:#2e8b57;--red:#c0392b;
}
body{background:radial-gradient(120% 90% at 50% 0%, #0e1a13 0%, var(--bg) 60%);color:var(--text);
  font-family:'Noto Sans SC',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px 60px}
.top{width:100%;max-width:430px;display:flex;align-items:center;justify-content:space-between;padding:18px 4px 6px}
.brand{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:5px;color:var(--gold-lt)}
.brand span{display:block;font-family:'Noto Sans SC';font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:2px}
.langs{display:flex;gap:6px}
.langs button{background:none;border:1px solid var(--line);color:var(--muted);font-size:11px;padding:4px 8px;border-radius:3px;cursor:pointer}
.langs button.on{color:var(--gold-lt);border-color:var(--gold)}
.wrap{width:100%;max-width:430px;margin-top:14px}
h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:30px;text-align:center;color:var(--gold-lt);letter-spacing:.06em;line-height:1.2}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-top:8px;line-height:1.6}
.card{background:linear-gradient(170deg,#0d1611,#070d0a);border:1px solid var(--gold);border-radius:8px;padding:26px 22px;margin-top:22px}
.step{display:none}
.step.on{display:block;animation:fade .4s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
label.fl{display:block;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
input[type=tel]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.3);
  color:var(--text);font-size:17px;letter-spacing:1px;outline:none;font-family:inherit}
input[type=tel]:focus{border-color:var(--gold)}
.consent{display:flex;gap:10px;align-items:flex-start;margin:16px 0 4px;font-size:13px;color:var(--muted);line-height:1.5}
.consent input{margin-top:3px;accent-color:var(--gold);width:16px;height:16px;flex:none}
.consent a{color:var(--gold-lt)}
.rules{display:none;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:4px;padding:12px 14px;
  font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px;max-height:150px;overflow-y:auto;white-space:pre-wrap}
.rules.on{display:block}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:4px;font-size:14px;letter-spacing:.15em;
  text-transform:uppercase;font-family:inherit;cursor:pointer;transition:all .2s;margin-top:16px}
.btn-gold{background:linear-gradient(160deg,var(--gold-lt),var(--gold-dk));color:#0a0f0c;font-weight:500}
.btn-gold:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn-ghost:hover{color:var(--gold-lt);border-color:var(--gold)}
.msg{border-radius:4px;padding:12px 14px;font-size:13px;line-height:1.6;margin-top:14px;display:none}
.msg.on{display:block}
.msg-err{background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.4);color:#e8a49c}
.msg-info{background:rgba(201,169,98,.1);border:1px solid var(--line);color:var(--gold-lt)}
/* 等待批准 */
.wait{text-align:center;padding:10px 0}
.wait .pulse{width:64px;height:64px;border:2px solid var(--gold);border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;font-size:26px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,169,98,.35)}50%{box-shadow:0 0 0 14px rgba(201,169,98,0)}}
.wait p{color:var(--muted);font-size:14px;line-height:1.8}
.wait strong{color:var(--gold-lt)}
/* 转盘 */
.wheel-box{position:relative;width:300px;height:300px;margin:10px auto 0}
.wheel-box canvas{width:100%;height:100%}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:3;
  width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:22px solid var(--gold-lt);
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;
  width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1d2b22,#0a120d);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;color:var(--gold-lt);font-size:12px;letter-spacing:1px;text-align:center}
/* 结果 */
.result{text-align:center;padding:8px 0}
.result .r-prize{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--gold-lt);margin:12px 0 4px;line-height:1.25}
.result .r-code{font-size:38px;letter-spacing:10px;color:var(--text);font-weight:500;margin:16px 0 6px;
  border:1px dashed var(--gold);border-radius:6px;padding:12px 0}
.result .r-note{font-size:13px;color:var(--muted);line-height:1.7}
.result .r-emoji{font-size:44px}
/* 我的中奖 */
.win-item{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-top:12px}
.win-item .w-prize{color:var(--gold-lt);font-size:15px}
.win-item .w-code{font-size:22px;letter-spacing:6px;margin:6px 0}
.win-item .w-meta{font-size:12px;color:var(--muted)}
.win-item .w-badge{display:inline-block;font-size:10px;letter-spacing:.1em;padding:2px 8px;border-radius:10px;margin-left:8px;text-transform:uppercase}
.b-active{background:rgba(46,139,87,.2);color:#7fd6a4;border:1px solid rgba(46,139,87,.5)}
.b-later{background:rgba(201,169,98,.12);color:var(--gold-lt);border:1px solid rgba(201,169,98,.4)}
.b-used{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}
.b-expired{background:rgba(192,57,43,.15);color:#e8a49c;border:1px solid rgba(192,57,43,.4)}
.foot{margin-top:34px;text-align:center;font-size:11px;color:rgba(240,234,217,.3);letter-spacing:2px}
.links{display:flex;gap:10px;margin-top:14px}
.links .btn{margin-top:0}
/* ══════════ v1.7 SCHERMATA PREMIO ══════════ */
.prizecard{position:relative;overflow:hidden;border-radius:14px;padding:30px 24px 26px;text-align:center;
  background:linear-gradient(168deg,#12201a 0%,#0c1611 45%,#070e0b 100%);border:1px solid var(--gold);
  box-shadow:0 18px 50px rgba(0,0,0,.65), inset 0 1px 0 rgba(232,213,163,.18);
  animation:cardIn .55s cubic-bezier(.2,.8,.3,1.1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.prizecard::after{content:'';position:absolute;top:-60%;left:-70%;width:60%;height:220%;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,246,214,.13),rgba(255,255,255,0));
  transform:rotate(18deg);animation:sheen 1.5s ease-out .35s both}
@keyframes sheen{to{left:130%}}
.corner{position:absolute;width:22px;height:22px;border:1px solid rgba(201,169,98,.55)}
.c-tl{top:10px;left:10px;border-right:0;border-bottom:0;border-radius:5px 0 0 0}
.c-tr{top:10px;right:10px;border-left:0;border-bottom:0;border-radius:0 5px 0 0}
.c-bl{bottom:10px;left:10px;border-right:0;border-top:0;border-radius:0 0 0 5px}
.c-br{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 5px 0}
.crest{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:.42em;color:var(--gold);opacity:.9}
.crest-sub{font-size:9px;letter-spacing:.34em;color:var(--muted);margin-top:3px}
.pdivider{display:flex;align-items:center;justify-content:center;gap:9px;margin:15px 0 4px}
.pdivider i{display:block;height:1px;width:52px;background:linear-gradient(90deg,rgba(201,169,98,0),rgba(201,169,98,.7))}
.pdivider i:last-child{background:linear-gradient(90deg,rgba(201,169,98,.7),rgba(201,169,98,0))}
.pdivider b{color:var(--gold);transform:rotate(45deg);display:block;width:5px;height:5px;
  border:1px solid var(--gold);border-radius:1px}
.kicker{font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--gold);margin-top:14px;opacity:.95}
.prizename{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.16;
  color:var(--gold-lt);margin-top:10px;text-shadow:0 2px 22px rgba(201,169,98,.28)}
.prizename.long{font-size:27px}
.housenote{font-size:12.5px;color:var(--muted);margin-top:9px}
.codewrap{margin-top:20px}
.codelabel{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.code{display:inline-flex;gap:6px}
.code span{width:38px;height:50px;display:flex;align-items:center;justify-content:center;
  font-size:25px;font-weight:500;color:var(--text);background:rgba(0,0,0,.42);
  border:1px solid var(--line);border-radius:6px;box-shadow:inset 0 1px 0 rgba(232,213,163,.1);
  animation:digit .4s both}
@keyframes digit{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.vbadge{display:inline-flex;align-items:center;gap:6px;margin-top:18px;padding:7px 14px;border-radius:20px;
  font-size:11.5px;line-height:1.3}
.v-today{background:rgba(46,139,87,.16);border:1px solid rgba(46,139,87,.5);color:#8fdcae}
.v-next{background:rgba(201,169,98,.12);border:1px solid var(--line);color:var(--gold-lt)}
.tillnote{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}
.stamp{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(240,234,217,.34)}
.stamp i{display:block;height:1px;width:26px;background:rgba(201,169,98,.3)}
.prizecard.big{border-color:var(--gold-lt);
  box-shadow:0 0 0 1px rgba(232,213,163,.25),0 22px 60px rgba(0,0,0,.7),0 0 70px rgba(201,169,98,.22);
  animation:cardIn .55s cubic-bezier(.2,.8,.3,1.1) both, halo 3.2s ease-in-out 1s infinite}
@keyframes halo{0%,100%{box-shadow:0 0 0 1px rgba(232,213,163,.25),0 22px 60px rgba(0,0,0,.7),0 0 70px rgba(201,169,98,.2)}
  50%{box-shadow:0 0 0 1px rgba(232,213,163,.4),0 22px 60px rgba(0,0,0,.7),0 0 100px rgba(201,169,98,.36)}}
.ribbon{display:inline-block;margin-top:2px;padding:5px 16px;border-radius:3px;
  font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:#0a0f0c;font-weight:500;
  background:linear-gradient(160deg,var(--gold-lt),var(--gold-dk))}
.prizecard.big .prizename{font-size:38px}
.prizecard.big .prizename.long{font-size:29px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:99}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="top">
  <div class="brand">YIO FISH<span id="storeName">LOTTERIA</span></div>
  <div class="langs">
    <button data-l="it" onclick="setLang('it')">IT</button>
    <button data-l="en" onclick="setLang('en')">EN</button>
    <button data-l="zh" onclick="setLang('zh')">中</button>
  </div>
</div>

<div class="wrap">
  <h1 id="tTitle"></h1>
  <p class="sub" id="tSub"></p>

  <!-- 非活动日 -->
  <div class="card step" id="stepDayOff">
    <div class="result"><div class="r-emoji">📅</div>
      <div class="r-prize" id="tDayOff"></div>
      <p class="r-note" id="tDayOffNote"></p>
    </div>
  </div>

  <!-- 活动未开 -->
  <div class="card step" id="stepClosed">
    <div class="result"><div class="r-emoji">🎡</div>
      <div class="r-prize" id="tClosed"></div>
      <p class="r-note" id="tClosedNote"></p>
    </div>
  </div>

  <!-- ① 手机号 + 同意 -->
  <div class="card step" id="stepForm">
    <label class="fl" id="tTable"></label>
    <input type="text" id="inTable" inputmode="numeric" maxlength="10" placeholder="12" style="width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.3);color:var(--text);font-size:17px;letter-spacing:1px;outline:none;font-family:inherit;margin-bottom:14px">
    <label class="fl" id="tPhone"></label>
    <input type="tel" id="inPhone" inputmode="tel" autocomplete="tel" placeholder="333 123 4567">
    <div class="consent">
      <input type="checkbox" id="inAgree">
      <div><span id="tAgree"></span> <a href="javascript:void(0)" id="lnkRules"></a>
        <div class="rules" id="boxRules"></div>
      </div>
    </div>
    <button class="btn btn-gold" id="btnRequest" onclick="doRequest()"></button>
    <button class="btn btn-ghost" id="btnMyWins2" onclick="loadMyWins()"></button>
    <button class="btn btn-gold" id="btnPaidForm" style="display:none;margin-top:12px" onclick="doRespin()"></button>
    <div class="msg msg-err" id="formErr"></div>
    <div class="msg msg-info" id="formInfo"></div>
  </div>

  <!-- ①b 快速注册（未注册号码）-->
  <div class="card step" id="stepRegister">
    <div class="result" style="padding-bottom:6px">
      <div class="r-emoji">🎁</div>
      <div class="r-prize" id="tRegTitle" style="font-size:24px"></div>
      <p class="r-note" id="tRegNote"></p>
    </div>
    <label class="fl" id="tRegPhone"></label>
    <input type="tel" id="regPhone" inputmode="tel" readonly style="width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.05);color:var(--muted);font-size:17px;letter-spacing:1px;outline:none;font-family:inherit;margin-bottom:14px">
    <label class="fl" id="tRegName"></label>
    <input type="text" id="regName" maxlength="50" style="width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.3);color:var(--text);font-size:17px;outline:none;font-family:inherit">
    <button class="btn btn-gold" id="btnRegister" onclick="doRegister()"></button>
    <button class="btn btn-ghost" onclick="showStep('stepForm')" id="btnRegBack"></button>
    <div class="msg msg-err" id="regErr"></div>
  </div>

  <!-- ② 等待店员批准 -->
  <div class="card step" id="stepWait">
    <div class="wait">
      <div class="pulse">⏳</div>
      <p id="tWait"></p>
    </div>
    <button class="btn btn-ghost" onclick="resetAll()"></button>
  </div>

  <!-- ③ 转盘 -->
  <div class="card step" id="stepWheel">
    <div class="wheel-box">
      <div class="pointer"></div>
      <canvas id="cv" width="600" height="600"></canvas>
      <div class="hub">YIO<br>FISH</div>
    </div>
    <button class="btn btn-gold" id="btnSpin" onclick="doSpin()"></button>
    <p class="sub" id="tSpinNote" style="margin-top:12px"></p>
  </div>

  <!-- ④ 结果 -->
  <div class="step" id="stepResult">
    <div id="resultSlot"></div>
    <button class="btn btn-gold" id="btnShare" style="display:none" onclick="doShare()"></button>
    <div class="links">
      <button class="btn btn-gold" id="btnAgain" style="display:none" onclick="goAgain()"></button>
      <button class="btn btn-gold" id="btnRespin" style="display:none" onclick="doRespin()"></button>
      <button class="btn btn-ghost" id="btnMyWins"></button>
    </div>
  </div>

  <!-- ⑤ 我的中奖 -->
  <div class="card step" id="stepWins">
    <div id="winsList"></div>
    <button class="btn btn-ghost" onclick="showStep('stepForm')" id="btnBack"></button>
  </div>
</div>

<div class="foot">YIO FISH · LOTTERIA · v1.9.0</div>

  if (!r.data.enabled){ showStep('stepClosed'); return; }
  if (r.data.today_on === false){ showStep('stepDayOff'); return; }
  CFG = r.data;
  $('boxRules').textContent = (CFG.rules && CFG.rules[LANG]) || CFG.rules.it || TP('rulesDefault');
  // 恢复：上次申请的请求还在进行中？
  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem('yioLot') || 'null'); } catch(e){}
  if (saved && saved.rid === RID && saved.requestId){
    REQ_ID = saved.requestId;
    PHONE = saved.phone || null; TABLE_NO = saved.table || null;
    var st = await api('/public/lottery/status?id=' + encodeURIComponent(REQ_ID));
    if (st.data.status === 'pending'){ startPolling(); showStep('stepWait'); return; }
    if (st.data.status === 'approved'){ prepareWheel(); return; }
    sessionStorage.removeItem('yioLot'); REQ_ID = null;
  }

async function doRequest(){
  hideErr('formErr'); hideErr('formInfo');
  $('btnPaidForm').style.display = 'none';
  var tableNo = $('inTable').value.trim();
  if (!tableNo){ showErr('formErr', T('errTable')); return; }
  var phone = $('inPhone').value.replace(/\s+/g, '');
  if (!/^\+?\d{9,13}$/.test(phone)){ showErr('formErr', T('errPhone')); return; }
  if (!$('inAgree').checked){ showErr('formErr', T('errAgree')); return; }
  $('btnRequest').disabled = true;
  var r;
  try {
    r = await api('/public/lottery/request', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ restaurant_id: RID, phone: phone, table_no: tableNo, agreed: true })
    });
  } catch (e) {
    $('btnRequest').disabled = false;
    showErr('formErr', T('errGeneric'));
    return;
  }
  $('btnRequest').disabled = false;
  var d = r.data;
  if (d.ok){
    REQ_ID = d.request_id; PHONE = phone; TABLE_NO = tableNo;
    sessionStorage.setItem('yioLot', JSON.stringify({ rid: RID, requestId: REQ_ID, phone: phone, table: tableNo }));
    if (d.status === 'approved'){ prepareWheel(); return; }
    startPolling(); showStep('stepWait'); return;
  }
  if (d.code === 'not_registered') { goRegister(phone); return; }
  else if (d.code === 'already_today'){
    showErr('formErr', T('errToday'));
    // v1.5.1 免费机会已用 → 给出付费再抽入口
    if (CFG && (parseInt(CFG.paid_spin_price) || 0) > 0){
      PHONE = phone; TABLE_NO = tableNo;
      $('btnPaidForm').textContent = T('respinBtn').replace('{p}', CFG.paid_spin_price);
      $('btnPaidForm').style.display = 'block';
    }
  }
  else if (d.code === 'table_full') showErr('formErr', T('errTableFull'));
  else if (d.code === 'day_off') showErr('formErr', T('errDayOff'));
  else showErr('formErr', d.error || T('errGeneric'));
}

// ── ③ 转盘 ──
// YIO 品牌色系转盘配色（金/米/苔绿/浅木/豆绿/象牙），按格子顺序交替；
// 后台若给某奖项单独设置了非默认色，则优先用后台色
var LOT_PALETTE = ['#c9a962', '#e8d5a3', '#9db89a', '#d9c089', '#b8cfa8', '#e3d9c2'];
function wheelSegs(){
  var segs = (CFG && CFG.segments ? CFG.segments : []).map(function(p, i){
    var c = p.color;
    if (!c || c.toLowerCase() === '#c9a962') c = LOT_PALETTE[i % LOT_PALETTE.length]; // 默认金=跟随品牌自动配色
    return { name: p.name, color: c, prize: true, off: !!p.off }; // v1.9.0 off=今日已出：灰显但转不到
  });
  if (!CFG || CFG.can_lose || segs.length === 0){
    segs.push({ name: (CFG && CFG.lose_label) || T('loseTitle'), color: '#1a2620', prize: false });
  }
  if (segs.length === 1){ // 单格也成轮：加一个未中格仅作视觉
    segs.push({ name: (CFG && CFG.lose_label) || '·', color: '#1a2620', prize: false });
  }
  return segs;
}
function drawWheel(rot){
  var cv = $('cv'), ctx = cv.getContext('2d');
  var segs = wheelSegs(), n = segs.length;
  var R = 300, cx = 300, cy = 300;
  ctx.clearRect(0, 0, 600, 600);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot || 0);
  var arc = Math.PI * 2 / n;
  for (var i = 0; i < n; i++){
    var a0 = i * arc - Math.PI / 2 - arc / 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, R - 6, a0, a0 + arc);
    ctx.closePath();
    ctx.fillStyle = segs[i].prize ? (segs[i].off ? '#26312b' : segs[i].color) : '#111a15'; // v1.9.0 今日已出格:深灰绿底
    ctx.fill();
    ctx.strokeStyle = 'rgba(201,169,98,.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 文字
    ctx.save();
    ctx.rotate(a0 + arc / 2);
    ctx.textAlign = 'right';
    var label = segs[i].name;
    if (label.length > 14) label = label.slice(0, 13) + '…';
    ctx.font = (segs[i].prize ? '600 24px' : '300 22px') + " 'Noto Sans SC', sans-serif";
    ctx.fillStyle = segs[i].off ? 'rgba(240,234,217,.5)' : (segs[i].prize ? '#0a0f0c' : 'rgba(240,234,217,.5)');
    ctx.fillText(label, R - 26, segs[i].off ? -2 : 8);
    if (segs[i].off){ ctx.font = "500 15px 'Noto Sans SC', sans-serif"; ctx.fillStyle = 'rgba(201,169,98,.9)'; ctx.fillText(T('segOff'), R - 26, 26); } // v1.9.0 今日已出小标签
    ctx.restore();
  }
  // 外圈
  ctx.beginPath(); ctx.arc(0, 0, R - 3, 0, Math.PI * 2);
  ctx.strokeStyle = '#c9a962'; ctx.lineWidth = 5; ctx.stroke();
  ctx.restore();
}
function prepareWheel(){
  showStep('stepWheel');
  drawWheel();
  $('btnSpin').disabled = false;
  $('tSpinNote').textContent = T('approved');
  setTimeout(function(){ if (!SPUN) $('tSpinNote').textContent = T('spinNote'); }, 2500);
}
// 旋转动画：从 0 转到目标角度（指针在正上方）
// ── v1.6.0 转盘嗒嗒声：Web Audio 现场合成，无需音频文件 ──
var LOT_ACTX = null, LOT_TICKBUF = null;
function lotAudioInit(){
  if (LOT_ACTX){ if (LOT_ACTX.state === 'suspended'){ try{ LOT_ACTX.resume(); }catch(e){} } return; }
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    LOT_ACTX = new AC();
    // 30ms 噪声 + 快速衰减包络 ≈ 真实拨片"嗒"声
    var len = Math.floor(LOT_ACTX.sampleRate * 0.03);
    LOT_TICKBUF = LOT_ACTX.createBuffer(1, len, LOT_ACTX.sampleRate);
    var d = LOT_TICKBUF.getChannelData(0);
    for (var i = 0; i < len; i++){
      var t = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.5);
    }
  } catch(e){ LOT_ACTX = null; LOT_TICKBUF = null; }
}
function lotTick(){
  if (!LOT_ACTX || !LOT_TICKBUF) return;
  try {
    var s = LOT_ACTX.createBufferSource(); s.buffer = LOT_TICKBUF;
    var g = LOT_ACTX.createGain(); g.gain.value = 0.22;
    s.connect(g); g.connect(LOT_ACTX.destination); s.start();
  } catch(e){}
}

function spinTo(segIndex, segCount, done){
  var arc = 360 / segCount;
  // 目标格中心需停在正上方（-90°）：目标旋转角 = -(segIndex*arc)
  var target = 360 * 6 - segIndex * arc; // 多转6圈
  var dur = 5200, t0 = performance.now();
  var lastSeg = -1;
  function frame(t){
    var p = Math.min(1, (t - t0) / dur);
    var ease = 1 - Math.pow(1 - p, 4); // easeOutQuart
    var deg = target * ease;
    drawWheel(deg * Math.PI / 180);
    // v1.6.0 指针每越过一格边界嗒一声（转速快时嗒声密、慢时稀，自然随减速）
    var seg = Math.floor(deg / arc);
    if (seg !== lastSeg){ if (lastSeg >= 0) lotTick(); lastSeg = seg; }
    if (p < 1) requestAnimationFrame(frame);
    else done();
  }
  requestAnimationFrame(frame);
}

// ── 抽奖：服务器先定结果，转盘只是演出 ──
async function doSpin(){
  if (SPUN || !REQ_ID) return;
  SPUN = true;
  $('btnSpin').disabled = true;
  lotAudioInit(); // v1.6.0 在点 GIRA 的手势里解锁音频(iOS/Safari 自动播放限制)
  var r;
  try {
    r = await api('/public/lottery/spin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ request_id: REQ_ID })
    });
  } catch (e) {
    SPUN = false; $('btnSpin').disabled = false;
    $('tSpinNote').textContent = T('errGeneric');
    return;
  }
  var d = r.data;
  if (!d.ok){
    SPUN = false; $('btnSpin').disabled = false;
    if (d.code === 'expired') backToForm(T('errExpired'));
    else if (d.code === 'already_today') backToForm(T('errToday'));
    else $('tSpinNote').textContent = d.error || T('errGeneric');
    return;
  }
  if (d.result !== 'retry') sessionStorage.removeItem('yioLot'); // retry: 请求仍有效，保留会话
  var segs = wheelSegs();
  var idx = 0;
  if (d.result === 'win' || d.result === 'retry'){
    idx = segs.findIndex(function(s){ return s.prize && s.name === d.prize_name; });
    if (idx < 0) idx = 0;
  } else {
    idx = segs.findIndex(function(s){ return !s.prize; });
    if (idx < 0) idx = segs.length - 1;
  }
  spinTo(idx, segs.length, function(){ showResult(d); });
}

  var d=new Date();
  var m=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  if (LANG==='zh') return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
  if (LANG==='en') return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear();
}
function esc2(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// ── 彩带 ──
var _fx=null,_fxc=null,_parts=[],_raf=null;
function fxInit(){
  if(_fx) return;
  _fx=document.getElementById('fx'); if(!_fx) return;
  _fxc=_fx.getContext('2d');
  var r=function(){ _fx.width=innerWidth; _fx.height=innerHeight; };
  addEventListener('resize',r); r();
}
function confetti(n){
  fxInit(); if(!_fxc) return;
  var cols=['#e8d5a3','#c9a962','#8a7238','#f0ead9','#2e8b57'];
  for(var i=0;i<n;i++) _parts.push({
    x:Math.random()*_fx.width, y:-20-Math.random()*_fx.height*.4,
    w:4+Math.random()*5, h:7+Math.random()*9,
    vy:1.6+Math.random()*2.6, vx:-1+Math.random()*2,
    rot:Math.random()*6.28, vr:-.12+Math.random()*.24,
    c:cols[(Math.random()*cols.length)|0], life:1 });
  if(!_raf) _raf=requestAnimationFrame(fxTick);
}
function fxTick(){
  _fxc.clearRect(0,0,_fx.width,_fx.height);
  for(var i=_parts.length-1;i>=0;i--){
    var p=_parts[i]; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vy+=.012;
    if(p.y>_fx.height*.62) p.life-=.014;
    if(p.life<=0||p.y>_fx.height+40){ _parts.splice(i,1); continue; }
    _fxc.save(); _fxc.translate(p.x,p.y); _fxc.rotate(p.rot);
    _fxc.globalAlpha=Math.max(0,p.life); _fxc.fillStyle=p.c;
    _fxc.fillRect(-p.w/2,-p.h/2,p.w,p.h); _fxc.restore();
  }
  if(_parts.length) _raf=requestAnimationFrame(fxTick);
  else { _raf=null; _fxc.clearRect(0,0,_fx.width,_fx.height); }
}

// ── 分享图 1080×1920 ──
function _rr(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r);
  x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
function _line(x,cx,y,w){ var g=x.createLinearGradient(cx-w,y,cx+w,y);
  g.addColorStop(0,'rgba(201,169,98,0)'); g.addColorStop(.5,'rgba(201,169,98,.75)');
  g.addColorStop(1,'rgba(201,169,98,0)'); x.strokeStyle=g; x.lineWidth=1;
  x.beginPath(); x.moveTo(cx-w,y); x.lineTo(cx+w,y); x.stroke(); }
function _sp(t,px){ return t.split('').join(String.fromCharCode(8202).repeat(Math.max(1,Math.round(px/3)))); }
function _wrap(x,t,cx,y,max,lh){
  var w=(t||'').split(' '), ln='', out=[];
  for(var i=0;i<w.length;i++){ var q=ln?ln+' '+w[i]:w[i];
    if(x.measureText(q).width>max&&ln){ out.push(ln); ln=w[i]; } else ln=q; }
  if(ln) out.push(ln);
  for(var j=0;j<out.length;j++) x.fillText(out[j],cx,y+j*lh);
}
function shareImage(d){
  var W=1080,H=1920,c=document.createElement('canvas'); c.width=W; c.height=H;
  var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,W*.5,H);
  g.addColorStop(0,'#0f1d16'); g.addColorStop(.45,'#0a1512'); g.addColorStop(1,'#050b09');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  var rg=x.createRadialGradient(W*.62,-120,60,W*.62,-120,900);
  rg.addColorStop(0,'rgba(232,213,163,.22)'); rg.addColorStop(1,'rgba(232,213,163,0)');
  x.fillStyle=rg; x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(201,169,98,.55)'; x.lineWidth=2; _rr(x,64,300,W-128,1320,22); x.stroke();
  x.strokeStyle='rgba(201,169,98,.22)'; x.lineWidth=1; _rr(x,80,316,W-160,1288,16); x.stroke();
  x.textAlign='center';
  x.fillStyle='#c9a962'; x.font='400 40px "Cormorant Garamond", serif';
  x.fillText(_sp('YIO FISH',10),W/2,420);
  x.fillStyle='rgba(240,234,217,.5)'; x.font='300 20px "Noto Sans SC", sans-serif';
  x.fillText(_sp('JAPANESE FUSION',6),W/2,462);
  _line(x,W/2,520,150);
  var tier=tierOf(d.prize_name), big=(tier==='big');
  if(big){ x.fillStyle='#e8d5a3'; x.font='400 22px "Noto Sans SC", sans-serif';
    x.fillText(_sp(T('ribbon').toUpperCase(),5),W/2,566); }
  x.fillStyle='#c9a962'; x.font='400 26px "Noto Sans SC", sans-serif';
  x.fillText(_sp(T('winKicker').toUpperCase(),7),W/2,620);
  x.fillStyle='#e8d5a3';
  var fs=(d.prize_name||'').length>20?72:88;
  x.font='600 '+fs+'px "Cormorant Garamond", serif';
  _wrap(x,d.prize_name,W/2,740,W-220,fs*1.16);
  x.fillStyle='rgba(240,234,217,.62)'; x.font='300 30px "Noto Sans SC", sans-serif';
  x.fillText(big?T('houseBig'):(tier==='mid'?T('houseMid'):T('houseSmall')),W/2,985);
  _line(x,W/2,1050,110);
  x.fillStyle='rgba(240,234,217,.45)'; x.font='300 22px "Noto Sans SC", sans-serif';
  x.fillText(_sp(T('codeLabel').toUpperCase(),5),W/2,1120);
  var code=(d.code||'').toString().replace(/\s/g,''), n=code.length, bw=88, gap=14;
  var tot=n*bw+(n-1)*gap, sx=(W-tot)/2;
  for(var i=0;i<n;i++){
    var bx=sx+i*(bw+gap);
    x.fillStyle='rgba(0,0,0,.4)'; _rr(x,bx,1160,bw,112,10); x.fill();
    x.strokeStyle='rgba(201,169,98,.45)'; x.lineWidth=1.5; _rr(x,bx,1160,bw,112,10); x.stroke();
    x.fillStyle='#f0ead9'; x.font='500 56px "Noto Sans SC", sans-serif';
    x.fillText(code[i],bx+bw/2,1236);
  }
  var vtxt=d.same_day?T('vToday'):(d.next_visit?T('vNext'):T('vUntil')).replace('{d}',d.expires_day||'');
  x.font='300 28px "Noto Sans SC", sans-serif';
  var tw=x.measureText(vtxt).width+64;
  x.fillStyle=d.same_day?'rgba(46,139,87,.18)':'rgba(201,169,98,.14)';
  _rr(x,(W-tw)/2,1340,tw,66,33); x.fill();
  x.strokeStyle=d.same_day?'rgba(46,139,87,.55)':'rgba(201,169,98,.45)'; x.lineWidth=1.5;
  _rr(x,(W-tw)/2,1340,tw,66,33); x.stroke();
  x.fillStyle=d.same_day?'#8fdcae':'#e8d5a3'; x.fillText(vtxt,W/2,1383);
  _line(x,W/2,1470,110);
  x.fillStyle='rgba(240,234,217,.42)'; x.font='300 24px "Noto Sans SC", sans-serif';
  x.fillText(todayStr()+' · '+storeLabel(),W/2,1530);
  return c;
}
async function doShare(){
  if(!LAST_WIN) return;
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    var canvas=shareImage(LAST_WIN);
    var blob=await new Promise(function(r){ canvas.toBlob(r,'image/png',.95); });
    var file=new File([blob],'yio-fish-premio.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], text:T('shareCap')+' \ud83c\udfa1' });
      return;
    }
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='yio-fish-premio.png'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
  }catch(e){}
}

function showResult(d){
  $('btnAgain').style.display='none';
  $('btnRespin').style.display='none';
  $('btnShare').style.display='none';
  var slot=$('resultSlot');
  _parts.length=0;

  if (d.result === 'retry'){
    LAST_WIN=null;
    slot.innerHTML = softHTML('\ud83c\udf8a', T('retryTitle'), T('retryNote'));
    $('btnAgain').textContent=T('againBtn');
    $('btnAgain').style.display='block';
    showStep('stepResult');
    return;
  }
  if (d.result === 'win'){
    LAST_WIN=d;
    slot.innerHTML = cardHTML(d);
    $('btnShare').textContent=T('shareBtn');
    $('btnShare').style.display='block';
    var t=tierOf(d.prize_name);
    if (t==='big') setTimeout(function(){ confetti(150); },420);
    else if (t==='mid') setTimeout(function(){ confetti(46); },420);
  } else {
    LAST_WIN=null;
    slot.innerHTML = softHTML('\ud83d\ude0c', T('loseTitle'), T('loseNote'));
  }
  if (CFG && (parseInt(CFG.paid_spin_price)||0) > 0){
    $('btnRespin').textContent=T('respinBtn').replace('{p}',CFG.paid_spin_price);
    $('btnRespin').style.display='block';
  }
  $('btnMyWins').onclick=loadMyWins;
  showStep('stepResult');
}

// 再来一次：回到转盘原地再转（请求在服务器端仍是 approved）
function goAgain(){
  SPUN = false;
  showStep('stepWheel');
  $('btnSpin').disabled = false;
  $('tSpinNote').textContent = T('retryNote');
}

// 付费再抽：+€N 再申请一次（店员确认收款后批准）
async function doRespin(){
  var phone = PHONE || $('inPhone').value.replace(/\s+/g, '');
  var tableNo = TABLE_NO || $('inTable').value.trim();
  if (!phone || !tableNo){ showStep('stepForm'); return; }
  $('btnRespin').disabled = true;
  var r;
  try {
    r = await api('/public/lottery/request', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ restaurant_id: RID, phone: phone, table_no: tableNo, agreed: true, kind: 'paid' })
    });
  } catch (e) {
    $('btnRespin').disabled = false;
    showErr('formErr', T('errGeneric'));
    showStep('stepForm');
    return;
  }
  $('btnRespin').disabled = false;
  var d = r.data;
  if (d.ok){
    REQ_ID = d.request_id; SPUN = false;
    sessionStorage.setItem('yioLot', JSON.stringify({ rid: RID, requestId: REQ_ID, phone: phone, table: tableNo }));
    if (d.status === 'approved'){ prepareWheel(); return; }
    startPolling(); showStep('stepWait'); return;
  }
  showErr('formErr', d.error || T('errGeneric'));
  showStep('stepForm');
}

// ── ⑤ 我的中奖 ──
async function loadMyWins(){
  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem('yioLot') || 'null'); } catch(e){}
  var phone = (saved && saved.phone) || $('inPhone').value.replace(/\s+/g, '');
  if (!phone){ showStep('stepForm'); return; }
  var r = await api('/public/lottery/wins?restaurant_id=' + encodeURIComponent(RID) + '&phone=' + encodeURIComponent(phone));
  var list = $('winsList');
  var wins = r.data.wins || [];
  if (!wins.length){
    list.innerHTML = '<p class="sub">' + T('noWins') + '</p>';
  } else {
    list.innerHTML = wins.map(function(w){
      var later = w.status === 'active' && w.usable === false;
      var badge = later ? 'b-later' : w.status === 'active' ? 'b-active' : w.status === 'used' ? 'b-used' : 'b-expired';
      var btxt = later ? T('status_later') : w.status === 'active' ? T('status_active') : w.status === 'used' ? T('status_used') : T('status_expired');
      return '<div class="win-item"><div class="w-prize">' + esc(w.prize_name)
        + '<span class="w-badge ' + badge + '">' + btxt + '</span></div>'
        + '<div class="w-code">' + esc(w.code) + '</div>'
        + '<div class="w-meta">' + T('wonOn') + ' ' + w.won_day + ' · ⏳ ' + w.expires_day + '</div></div>';
    }).join('');
  }
  showStep('stepWins');
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
